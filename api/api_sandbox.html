<!--
  ZONING API SANDBOX — live request against the mock endpoint (Squarespace Code Block).

  Left column: endpoint picker, what it returns, the query inputs, and the call button.
  Right column: one flat terminal that prints the real response, coloured to match
  api_terminal.html.

  ▶ THIS CALLS A REAL ENDPOINT. GET https://api.zoningatlas.org/rpc/zoning_point_mock
    ?lat=&lon=, a PostgREST mock of /v1/zoning/point. It is TEMPORARY — the zoning-api
    docs say it is dropped when the real endpoint ships. When that happens, change the
    `url` in ENDPOINTS below and nothing else: the response shape is identical by design
    (the mock is byte-equal to the reference harness on all ten fixtures).

  ▶ ADDING A QUERY TYPE is one entry in ENDPOINTS — id, the label shown in the picker,
    the path the terminal prints, the URL actually called, and the blurb under the
    picker. The picker renders whether there is one entry or five.

  ▶ THE KEY IS NOT SECRET, AND CANNOT BE. It is in this file, so it is in the page, so
    any visitor can read it — View Source, or DevTools → Network → Request Headers.
    It is assembled at runtime from base64 fragments so it does not sit in the source as
    a greppable string. THAT IS OBFUSCATION, NOT SECURITY. Treat the key as published:
      · use a sandbox-only key, never the one the Phase 2 GUI builds against, so it can
        be rotated without breaking anything else;
      · put a rate limit in front of /rpc/ (Cloudflare rule);
      · the real protection is already in the SQL — the four demo jurisdictions are
        hardcoded in the function body, never a parameter, so a leaked key reaches
        nothing else.
    To make it genuinely secret, move it behind a gateway (Azure API Management, or a
    Cloudflare Worker meanwhile): point the endpoint at the gateway, delete KEY_PARTS and
    the X-API-Key header here, and let the gateway add it server-side.

  ▶ THE KEY TRAVELS AS A HEADER, never a query parameter — a query string is written into
    CDN and server access logs, browser history and Referer headers; a header is not.

  ▶ ADDRESS → COORDINATES uses Photon (photon.komoot.io), keyless and CORS-enabled, the
    provider the zoning-api evaluation tested. It is NOT lul-geo-search — that helper is
    a typeahead over LUL's own backend resolving a jurisdiction NAME to a geoId, and
    never returns coordinates. Photon is OSM-derived and weak in rural areas (measured:
    0 of 21 rural-NM addresses landed inside the right parcel), so the resolved
    coordinate is always shown and stays on screen after the call.

  ▶ THE GEOGRAPHIC LOCK IS A FEATURE, NOT AN ERROR. A point outside the four demo
    jurisdictions returns coverage.status = "outside_demo" — "real data exists here, this
    key does not reach it", never "we have no data".

  ▶ THE TERMINAL IS FLAT: square corners, no title bar. The status the bar used to carry
    is printed as a dim comment at the top of the output instead.

  ▶ HIDDEN TABS: requestAnimationFrame gets zero frames in a background tab, so the print
    renders complete and still if the page is hidden, and finishes immediately if it goes
    hidden mid-print. Same for prefers-reduced-motion.

  ▶ EDIT THESE: ENDPOINTS, JURISDICTIONS, DICTIONARY_URL, EXAMPLE.
    Root id #lul-sandbox, class prefix lul-sb__ — safe alongside the order forms
    (lul-di__ / lul-sl__) and the hero.
-->

            /* NOT scrollbar-width/scrollbar-color: when either standard property is
               set, Chrome switches to the standard styling path and IGNORES the
               ::-webkit-scrollbar rules below — which on macOS leaves an overlay bar

        /* IDE-style indent guides. Each line paints one 1px rule per enclosing level,
           using a repeating gradient clipped to that line's own indent width — so a

    <script>
        (function () {
            "use strict";

            var root = document.getElementById("lul-sandbox");
            if (!root || root.dataset.sbReady) return;
            root.dataset.sbReady = "1";

            /* ── edit these ─────────────────────────────────────────────────────── */
            var DICTIONARY_URL =
                "https://docs.google.com/spreadsheets/d/17nrhEbS1OuwdRotXZwyiKmVuKccYH1A3/edit?gid=1390244737#gid=1390244737";

            /* One entry per query type. Add another and it appears in the picker. */
            var ENDPOINTS = [
                {
                    id: "zoning",
                    label: "v1/zoning",
                    path: "/v1/zoning/point", // what the terminal prints
                    url: "https://api.zoningatlas.org/rpc/zoning_point_mock", // what is called
                    blurb:
                        "Zoning endpoint returns all zoning districts and their regulations " +
                        'based on our <a href="' +
                        DICTIONARY_URL +
                        '" target="_blank" rel="noopener">parcel reports data dictionary</a>.'
                }
            ];

            var JURISDICTIONS = [
                "West Boylston, Massachusetts",
                "Saugerties, New York",
                "Hyde Park, Vermont",
                "Moriarty, New Mexico"
            ];

            var GEOCODER = "https://photon.komoot.io/api/";
            var EXAMPLE = { lat: "42.107278", lon: "-73.971543" };

            /* The key, in fragments. Obfuscation only — see the header comment. */
            var KEY_PARTS = ["eUdoZGIzNW", "dhaTVXQVJh", "ak5hZk1CdVZq"];
            function apiKey() {
                return atob(KEY_PARTS.join(""));
            }

            var PRINT_MS = 2200; // target duration of the whole print
            /* ───────────────────────────────────────────────────────────────────── */

            var els = {
                picker: root.querySelector(".lul-sb__picker"),
                pick: root.querySelector("[data-sb-pick]"),
                pickname: root.querySelector("[data-sb-pickname]"),
                menu: root.querySelector("[data-sb-menu]"),
                blurb: root.querySelector("[data-sb-blurb]"),
                lock: root.querySelector("[data-sb-lock]"),
                call: root.querySelector("[data-sb-call]"),
                lat: root.querySelector("[data-sb-lat]"),
                lon: root.querySelector("[data-sb-lon]"),
                addr: root.querySelector("[data-sb-addr]"),
                status: root.querySelector("[data-sb-status]"),
                out: root.querySelector("[data-sb-out]"),
                termlabel: root.querySelector("[data-sb-termlabel]")
            };

            var reduced =
                window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
            var raf = null;
            var current = ENDPOINTS[0];

            function esc(s) {
                return String(s).replace(/[&<>"]/g, function (c) {
                    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
                });
            }

            /* ── the geographic lock, as one paragraph ── */
            els.lock.textContent =
                "This demo will only return data from a limited area within four jurisdictions — " +
                JURISDICTIONS.slice(0, -1).join("; ") +
                "; and " +
                JURISDICTIONS[JURISDICTIONS.length - 1] +
                ". A point anywhere else returns outside_demo, which means real data exists " +
                "there but this demo key does not reach it.";

            /* ── endpoint picker ── */
            els.menu.innerHTML = ENDPOINTS.map(function (ep) {
                return (
                    '<li role="option"><button type="button" class="lul-sb__menuitem" data-ep="' +
                    esc(ep.id) +
                    '">' +
                    esc(ep.label) +
                    "</button></li>"
                );
            }).join("");

            function openMenu() {
                els.menu.hidden = false;
                els.pick.setAttribute("aria-expanded", "true");
            }
            function closeMenu() {
                els.menu.hidden = true;
                els.pick.setAttribute("aria-expanded", "false");
                var items = els.menu.querySelectorAll("[data-ep]");
                for (var i = 0; i < items.length; i++) {
                    items[i].setAttribute(
                        "aria-current",
                        items[i].getAttribute("data-ep") === current.id ? "true" : "false"
                    );
                }
            }
            function selectEndpoint(ep) {
                current = ep;
                els.pickname.textContent = ep.label;
                els.blurb.innerHTML = ep.blurb;
                closeMenu();
                resetTerm();
            }

            els.pick.addEventListener("click", function () {
                if (els.menu.hidden) openMenu();
                else closeMenu();
            });
            els.menu.addEventListener("click", function (e) {
                var btn = e.target.closest("[data-ep]");
                if (!btn) return;
                var id = btn.getAttribute("data-ep");
                for (var i = 0; i < ENDPOINTS.length; i++) {
                    if (ENDPOINTS[i].id === id) {
                        selectEndpoint(ENDPOINTS[i]);
                        return;
                    }
                }
            });
            document.addEventListener("click", function (e) {
                if (!els.menu.hidden && !els.picker.contains(e.target)) closeMenu();
            });
            document.addEventListener("keydown", function (e) {
                if (e.key === "Escape" && !els.menu.hidden) {
                    closeMenu();
                    els.pick.focus();
                }
            });

            /* ── status line ── */
            function say(msg, isError) {
                els.status.textContent = msg || "";
                els.status.classList.toggle("is-error", !!isError);
            }

            /* ── terminal ── */
            function clearTerm() {
                if (raf) {
                    cancelAnimationFrame(raf);
                    raf = null;
                }
                els.out.textContent = "";
            }

            /* A line is { d: indent depth, h: html }. Depth drives the indent guides;
               plain strings are accepted and treated as depth 0. */
            function mkLine(line) {
                var el = document.createElement("span");
                el.className = "lul-sb__line";
                if (typeof line === "string") {
                    el.innerHTML = line;
                } else {
                    if (line.d) el.style.setProperty("--depth", line.d);
                    el.innerHTML = line.h;
                }
                return el;
            }

            function addLine(line) {
                var el = mkLine(line);
                els.out.appendChild(el);
                return el;
            }

            function resetTerm() {
                clearTerm();
                els.termlabel.textContent = "zoning-api";
                addLine(
                    '<span class="lul-sb__note"># enter a coordinate or an address, then Call API</span>'
                );
                addLine("");
                addLine(
                    '<span class="lul-sb__method">GET </span><span class="lul-sb__url">' +
                        esc(current.path + "?lat=" + EXAMPLE.lat + "&lon=" + EXAMPLE.lon) +
                        '</span><span class="lul-sb__caret"></span>'
                );
            }

            function dump(lines, from) {
                var frag = document.createDocumentFragment();
                for (var i = from; i < lines.length; i++) frag.appendChild(mkLine(lines[i]));
                els.out.appendChild(frag);
                els.out.scrollTop = 0;
            }

            /* Print a few lines per frame, scrolling to follow.

               requestAnimationFrame, not setInterval: each batch appends nodes and then
               reads scrollHeight, forcing a synchronous layout of a list that keeps
               growing, so a nominal short interval drifts badly on a long response. The
               batch is sized from the line count, so a 500-line response and a 3-line
               error both land near PRINT_MS.

               rAF GETS ZERO FRAMES IN A HIDDEN TAB — not slow frames, none. So render
               complete and still if the page is hidden at the start, and finish the
               remainder immediately if it goes hidden mid-print; otherwise a visitor who
               switches tab returns to a frozen half-response and a dead button. */
            function printLines(lines, done) {
                if (reduced || document.hidden) {
                    dump(lines, 0);
                    if (done) done();
                    return;
                }
                var frames = Math.max(1, Math.round(PRINT_MS / 16));
                var per = Math.max(1, Math.min(30, Math.ceil(lines.length / frames)));
                var i = 0;
                var finished = false;

                function finish(fromIndex) {
                    if (finished) return;
                    finished = true;
                    document.removeEventListener("visibilitychange", onHide);
                    if (raf) {
                        cancelAnimationFrame(raf);
                        raf = null;
                    }
                    if (fromIndex < lines.length) dump(lines, fromIndex);
                    els.out.scrollTop = 0;
                    if (done) done();
                }
                function onHide() {
                    if (document.hidden) finish(i);
                }
                document.addEventListener("visibilitychange", onHide);

                function step() {
                    var frag = document.createDocumentFragment();
                    for (var n = 0; n < per && i < lines.length; n++, i++) {
                        frag.appendChild(mkLine(lines[i]));
                    }
                    els.out.appendChild(frag);
                    els.out.scrollTop = els.out.scrollHeight;
                    if (i < lines.length) raf = requestAnimationFrame(step);
                    else finish(lines.length);
                }
                raf = requestAnimationFrame(step);
            }

            /* ── JSON → coloured lines ──────────────────────────────────────────────
               Two-space indented, one array entry per line, braces kept, so the block
               reads as JSON rather than a table. */
            function jsonLines(value, indent, keyName, isLast) {
                var pad = new Array(indent + 1).join("  ");
                var out = [];
                var prefix =
                    pad +
                    (keyName !== null
                        ? '<span class="lul-sb__k">"' +
                          esc(keyName) +
                          '"</span><span class="lul-sb__p">: </span>'
                        : "");
                var tail = isLast ? "" : '<span class="lul-sb__p">,</span>';

                var L = function (html) {
                    return { d: indent, h: html };
                };

                if (value === null) return [L(prefix + '<span class="lul-sb__n">null</span>' + tail)];
                if (typeof value === "boolean" || typeof value === "number")
                    return [L(prefix + '<span class="lul-sb__n">' + value + "</span>" + tail)];
                if (typeof value === "string")
                    return [L(prefix + '<span class="lul-sb__s">"' + esc(value) + '"</span>' + tail)];

                if (Array.isArray(value)) {
                    if (!value.length) return [L(prefix + '<span class="lul-sb__p">[]</span>' + tail)];
                    out.push(L(prefix + '<span class="lul-sb__p">[</span>'));
                    value.forEach(function (v, i) {
                        out = out.concat(jsonLines(v, indent + 1, null, i === value.length - 1));
                    });
                    out.push(L(pad + '<span class="lul-sb__p">]</span>' + tail));
                    return out;
                }
                var keys = Object.keys(value);
                if (!keys.length) return [L(prefix + '<span class="lul-sb__p">{}</span>' + tail)];
                out.push(L(prefix + '<span class="lul-sb__p">{</span>'));
                keys.forEach(function (k, i) {
                    out = out.concat(jsonLines(value[k], indent + 1, k, i === keys.length - 1));
                });
                out.push(L(pad + '<span class="lul-sb__p">}</span>' + tail));
                return out;
            }

            /* ── inputs ── */
            function markBad(el, bad) {
                el.classList.toggle("is-bad", !!bad);
            }
            function readCoords() {
                var lat = parseFloat(String(els.lat.value).trim());
                var lon = parseFloat(String(els.lon.value).trim());
                var latOk = isFinite(lat) && Math.abs(lat) <= 90;
                var lonOk = isFinite(lon) && Math.abs(lon) <= 180;
                markBad(els.lat, els.lat.value.trim() && !latOk);
                markBad(els.lon, els.lon.value.trim() && !lonOk);
                return latOk && lonOk ? { lat: lat, lon: lon } : null;
            }

            /* Address → coordinates. Photon returns [lon, lat]. */
            function geocode(address) {
                return fetch(GEOCODER + "?limit=1&q=" + encodeURIComponent(address))
                    .then(function (r) {
                        if (!r.ok) throw new Error("geocoder returned " + r.status);
                        return r.json();
                    })
                    .then(function (j) {
                        var f = j && j.features && j.features[0];
                        if (!f) throw new Error("no match for that address");
                        var p = f.properties || {};
                        return {
                            lon: f.geometry.coordinates[0],
                            lat: f.geometry.coordinates[1],
                            label: [p.name, p.city, p.state].filter(Boolean).join(", ")
                        };
                    });
            }

            function busy(on) {
                els.call.disabled = on;
                els.call.classList.toggle("is-busy", on);
            }

            function run() {
                var coords = readCoords();
                var address = String(els.addr.value).trim();
                if (!coords && !address) {
                    say("Enter a latitude and longitude, or an address.", true);
                    return;
                }

                busy(true);
                clearTerm();

                /* Whether this call went through the geocoder. If it did, the resolved
                   coordinate stays on screen after a successful call — Photon is weak in
                   rural areas, so "here is where I put your address" is the one piece of
                   feedback that lets a visitor catch a bad match. */
                var geocoded = !coords;

                var resolve = coords
                    ? Promise.resolve(coords)
                    : (say("Locating address…"),
                      geocode(address).then(function (g) {
                          els.lat.value = g.lat.toFixed(6);
                          els.lon.value = g.lon.toFixed(6);
                          say(
                              "Geocoded to " +
                                  g.lat.toFixed(6) +
                                  ", " +
                                  g.lon.toFixed(6) +
                                  (g.label ? " — " + g.label : "") +
                                  ". Check it before trusting the answer."
                          );
                          return g;
                      }));

                resolve
                    .then(function (c) {
                        var qs = "?lat=" + c.lat + "&lon=" + c.lon;
                        addLine(
                            '<span class="lul-sb__method">GET </span><span class="lul-sb__url">' +
                                esc(current.path + qs) +
                                "</span>"
                        );
                        return fetch(current.url + qs, {
                            headers: { "X-API-Key": apiKey(), Accept: "application/json" }
                        }).then(function (r) {
                            return r.json().then(function (body) {
                                return { status: r.status, body: body };
                            });
                        });
                    })
                    .then(function (res) {
                        var body = res.body;
                        var fields = body && body.zoning ? Object.keys(body.zoning).length : 0;
                        var cov = body && body.coverage && body.coverage.status;

                        els.termlabel.textContent =
                            "zoning-api · " +
                            res.status +
                            (fields ? " · " + fields + " fields" : "") +
                            (cov ? " · " + cov : "");

                        if (cov === "outside_demo") {
                            say(
                                "outside_demo — real data exists here, but this demo key only reaches the four jurisdictions above."
                            );
                        } else if (res.status >= 400) {
                            say((body && body.message) || "Request failed.", true);
                        } else if (!geocoded) {
                            say("");
                        }

                        printLines(jsonLines(body, 0, null, true), function () {
                            busy(false);
                        });
                    })
                    .catch(function (err) {
                        var msg = err && err.message ? err.message : "Request failed";
                        els.termlabel.textContent = "zoning-api · error";
                        addLine('<span class="lul-sb__err">' + esc(msg) + "</span>");
                        say(msg, true);
                        busy(false);
                    });
            }

            els.call.addEventListener("click", run);
            [els.lat, els.lon, els.addr].forEach(function (el) {
                el.addEventListener("keydown", function (e) {
                    if (e.key === "Enter") {
                        e.preventDefault();
                        run();
                    }
                });
            });
            /* typing an address clears stale coordinates so the two can't disagree */
            els.addr.addEventListener("input", function () {
                if (els.addr.value.trim()) {
                    els.lat.value = "";
                    els.lon.value = "";
                    markBad(els.lat, false);
                    markBad(els.lon, false);
                }
            });

            selectEndpoint(ENDPOINTS[0]);
        })();
    </script>
</section>
