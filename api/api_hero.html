<!--
  API — HERO / PAGE TITLE (Squarespace Code Block).

  Left aligned. The ">" prompt sits on the title itself, and "Zoning API"
  types out once on load, leaving a blinking caret. The subtitle sets GET and the
  {variable} as inline code in the house primary purple.

  ▶ THE {variable} CYCLES through regulation types taken from the Parcel
    Reports sheet of the data dictionary — min_lot_size, min_parking,
    treatment, setback and so on. Each one SCRAMBLES into the next: the
    characters flicker through a code-ish alphabet and lock in left to right.
    It goes word-to-word with no empty state between, so the braces never
    flash as "{}".
  ▶ THE BRACES HUG THE WORD, and nothing gets pushed — the line breaks
    immediately after the {variable}, so there is nothing to its right to
    move. That's why no width reservation is needed here: the only thing that
    changes is where line one ends.

  ▶ TYPES ONCE, not on a loop — it's a page title, not an animation. The
    caret is solid while it types and blinks from the last character onward,
    at --lulapi-blink. Under prefers-reduced-motion the title is written out
    complete and still, with no caret at all.
  ▶ ACCESSIBILITY: the ">" and the caret are decoration, so they're
    aria-hidden, and the <h1> carries an aria-label with the real title —
    otherwise a screen reader would announce a half-typed heading.
  ▶ TITLE SIZE is clamped against the WINDOW's width (vw), so it keeps its
    5rem on a desktop window and eases down as the browser narrows. Note this
    tracks the window, not the code block — a narrow Squarespace column at a
    wide window keeps the full 5rem.
  ▶ NO LAYOUT SHIFT: the heading holds its height from line-height whether or
    not any characters have been typed yet, and the caret is inline, so
    nothing below it moves as the title fills in.
  ▶ Classes are prefixed lul-apihero- / --lulapi- so this can share a page
    with the terminal graphic and the building blocks.
-->
<!-- Local preview only. Squarespace already carries styles/lul.css in Custom
     CSS; this line just makes the block render correctly on its own. -->
<link rel="stylesheet" href="../styles/lul.css">


<section class="lul-apihero">
    <style>
        .lul-apihero {
            /* Colour and type come from styles/lul.css. The ink, the muted grey and
               the primary purple are all tokens there now; only this tint stays
               local, because the ramp is ink-based and this is a primary tint. */
            --lulapi-code-bg: rgba(89, 68, 150, 0.09);

            --lulapi-max-w: 1100px; /* width of the CONTENT */
            --lulapi-gutter: 24px; /* added to the cap, not taken out of it */

            /* 5rem is the intended size and it holds on any normal desktop
               window. vw is a share of the WINDOW, so it eases down as the
               browser narrows. Two numbers fall out of the middle value: the
               title holds 5rem above 8000/N px of window and bottoms out
               below 4rem*16*100/N px. At 6.5 that's 1231px and 985px. */
            --lulapi-title-size: clamp(4rem, 6.5vw, 5rem);
            --lulapi-blink: 1.05s; /* caret blink period */

            font-family: var(--lul-font-body);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            color: var(--lul-ink);
            width: 100%;
            max-width: calc(var(--lulapi-max-w) + 2 * var(--lulapi-gutter));
            margin-left: auto;
            margin-right: auto;
            padding: 0 25px 0 0;
            box-sizing: border-box;
            text-align: left;
        }
        .lul-apihero *,
        .lul-apihero *::before,
        .lul-apihero *::after {
            box-sizing: border-box;
        }

        .lul-apihero__headline {
            /* The display treatment from lul.css: Space Grotesk at the oversized
               weight. --lul-weight-display-alt (500) rather than --lul-weight-display
               (700) because the scale reserves the lighter one for exactly this —
               "oversized treatments only" — and Space Grotesk ships only 500 and 700,
               so the previous 600 was being synthesised by the browser anyway.
               The size stays a local clamp: the hero is deliberately larger than
               --lul-size-display (56px) and needs to scale with the viewport. */
            font-family: var(--lul-font-display);
            font-weight: var(--lul-weight-display-alt);
            font-size: var(--lulapi-title-size);
            /* At 1.1 the line box is shorter than the font's own ascent plus
               descent, so the tail of the "g" in Zoning hangs below it and any
               ancestor with overflow:hidden — which Squarespace sections often
               have — shears it off. The padding gives the descender somewhere
               to sit without changing the line spacing or the type size. */
            line-height: 1.1;
            padding-bottom: 0.12em;
            letter-spacing: var(--lul-track-display);
            margin: 0;
            color: var(--lul-ink);
        }
        /* the ">" — a design device, sized and spaced off the title */
        .lul-apihero__prompt {
            color: var(--lul-primary);
            font-family: "SF Mono", SFMono-Regular, ui-monospace, Menlo, Consolas, monospace;
            font-weight: 700;
            margin-right: 0.28em;
        }
        /* Solid while the title types, blinking once it lands. */
        .lul-apihero__caret {
            display: inline-block;
            width: 0.055em;
            height: 0.86em;
            background: currentColor;
            margin-left: 0.08em;
            vertical-align: -0.06em;
        }
        .lul-apihero.is-typed .lul-apihero__caret {
            /* steps(1) so it snaps on and off like a terminal cursor rather
               than fading through half-opacity */
            animation: lul-apihero-blink var(--lulapi-blink) steps(1) infinite;
        }
        @keyframes lul-apihero-blink {
            50% {
                opacity: 0;
            }
        }

        .lul-apihero__subtitle {
            font-size: var(--lul-size-body-l);
            line-height: var(--lul-leading-body-l);
            color: var(--lul-grey-dark);
            margin: 20px 0 0;
            max-width: 46ch;
        }
        /* The cycling regulation type. No reserved width — the braces hug
           whatever is typed, which is safe because the line BREAKS straight
           after it, so there's nothing to its right to push around. */
        .lul-apihero__slot {
            white-space: pre;
        }

        /* the parcel count, picked out in the same purple */
        .lul-apihero__num {
            color: var(--lul-primary);
            font-weight: 700;
        }

        /* GET and the {variable}, set as code */
        .lul-apihero__code {
            font-family: "SF Mono", SFMono-Regular, ui-monospace, Menlo, Consolas, "Liberation Mono", monospace;
            font-size: 0.92em;
            font-weight: 700;
            color: var(--lul-primary);
            background: var(--lulapi-code-bg);
            padding: 0.1em 0.34em;
            border-radius: 4px;
            white-space: nowrap;
        }

        @media (prefers-reduced-motion: reduce) {
            .lul-apihero__caret {
                display: none;
            }
            .lul-apihero.is-typed .lul-apihero__caret {
                animation: none;
            }
        }
    </style>

    <h1 class="lul-apihero__headline" aria-label="Zoning API">
        <span class="lul-apihero__prompt" aria-hidden="true">&gt;</span><span data-hero-title aria-hidden="true"></span
        ><span class="lul-apihero__caret" aria-hidden="true"></span>
    </h1>

    <p class="lul-apihero__subtitle">
        <code class="lul-apihero__code">GET</code> comprehensive information for
        <code class="lul-apihero__code">{<span class="lul-apihero__slot" data-hero-var></span>}</code><br />
        across <span class="lul-apihero__num">96+ million</span> parcels with our API endpoint. Just input an address or
        coordinates and receive a JSON object.
    </p>

    <script>
        (function () {
            var root = document.currentScript.closest(".lul-apihero");
            var el = root.querySelector("[data-hero-title]");

            var slot = root.querySelector("[data-hero-var]");

            var TITLE = "Zoning API";
            var SPEED = 55; // ms per character of the title

            /* Regulation types from the Parcel Reports sheet of
               Land Use Labs - Data Dictionary.xlsx, as field-style tokens. */
            var VARS = [
                "min_lot_size",
                "min_parking",
                "treatment",
                "setback",
                "lot_coverage",
                "max_height",
                "unit_cap",
                "far",
            ];
            var VAR_TIMING = {
                frame: 40, // ms between scramble frames
                settle: 2.2, // frames each character scrambles before locking
                hold: 1600, // ms to sit on a finished word
            };
            /* what the unresolved characters flicker through — kept to the
               alphabet a field name would actually use, so mid-scramble it
               still reads as code rather than noise */
            var SCRAMBLE_CHARS = "abcdefghijklmnopqrstuvwxyz_0123456789";

            var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
            if (reduced) {
                el.textContent = TITLE;
                root.classList.add("is-typed");
                slot.textContent = VARS[0];
                return;
            }

            /* title: types once, then the caret goes away for good */
            var c = 0;
            (function step() {
                el.textContent = TITLE.slice(0, ++c);
                if (c < TITLE.length) return setTimeout(step, SPEED);
                root.classList.add("is-typed");
                cycleVars();
            })();

            function randChar() {
                return SCRAMBLE_CHARS.charAt(Math.floor(Math.random() * SCRAMBLE_CHARS.length));
            }

            /* Scrambles from one word straight into the next: no empty state
               in between, so the braces never collapse to "{}". Characters
               lock in left to right — each one starts scrambling on its own
               frame and settles VAR_TIMING.settle frames later — while the
               word's length eases from the old length to the new one, so the
               braces grow or shrink smoothly instead of snapping. */
            function scrambleTo(from, to, done) {
                var span = Math.max(from.length, to.length);
                var total = span + Math.ceil(VAR_TIMING.settle) + 1;
                var frame = 0;

                var timer = setInterval(function () {
                    var progress = Math.min(1, frame / total);
                    var len = Math.round(from.length + (to.length - from.length) * progress);
                    var out = "";

                    for (var i = 0; i < len; i++) {
                        if (frame >= i + VAR_TIMING.settle) {
                            // locked: show the real character (or nothing, if
                            // the target is shorter than we've drawn so far)
                            out += to.charAt(i) || "";
                        } else if (frame >= i) {
                            out += randChar(); // mid-scramble
                        } else {
                            out += from.charAt(i) || randChar(); // not reached yet
                        }
                    }
                    slot.textContent = out;

                    if (++frame > total) {
                        clearInterval(timer);
                        slot.textContent = to;
                        done();
                    }
                }, VAR_TIMING.frame);
            }

            /* the {variable}: scramble into the next word, hold, repeat */
            function cycleVars() {
                var i = 0;
                slot.textContent = VARS[0];
                (function next() {
                    setTimeout(function () {
                        var from = VARS[i];
                        i = (i + 1) % VARS.length;
                        scrambleTo(from, VARS[i], next);
                    }, VAR_TIMING.hold);
                })();
            }
        })();
    </script>
</section>
