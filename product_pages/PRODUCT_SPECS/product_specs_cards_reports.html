<!--
  PRODUCT SPECS CARDS — three icon cards, 3 across (Squarespace Code Block).
  Same card system as the use-case cards.
  TYPE, COLOUR AND LAYOUT ALL COME FROM styles/lul.css (section 6, .lul-uc).
  This file is markup only.
  Informational, not links — <article> elements, no hover lift. To make them
  clickable, swap <article> for <a href="…"> and add .lul-uc__card--link.
  ▶ REFLOW: measured against the BLOCK's width, not the browser window —
    3 across, stacked under 640px.
  ▶ ICONS: the mockup used the same wrench on all three cards as a
    placeholder; these are three distinct glyphs instead. Swap the <path>
    data for any 24x24 outline icon.

  Note: this is the CARD version of the specs. product_specs.html is the older
  bordered-grid treatment of similar content (Unit of Analysis / What's
  Included / Format) — keep whichever the page calls for, they are not meant
  to appear together.
-->

<!-- Local preview only. Squarespace already carries these rules in Custom CSS,
     so this line can be deleted when pasting the block in (harmless if left). -->
<link rel="stylesheet" href="../../styles/lul.css">

<section class="lul lul-uc" aria-label="Product specifications">
    <div class="lul-uc__grid">
        <!-- Zoning Slice — overlapping shapes, for the geometric intersection -->
        <article class="lul-uc__card">
            <span class="lul-uc__icon">
                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.6"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                >
                    <rect x="3" y="3" width="12" height="12" />
                    <rect x="9" y="9" width="12" height="12" />
                </svg>
            </span>
            <h4 class="lul-uc__title">Individual Parcel</h4>
            <p class="lul-uc__body">One report per address. Order by full street address including city and state.</p>
        </article>
        <!-- Customizable Variables — sliders -->
        <article class="lul-uc__card">
            <span class="lul-uc__icon">
                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.6"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                >
                    <path d="M4 6h16" />
                    <path d="M4 12h16" />
                    <path d="M4 18h16" />
                    <circle cx="9" cy="6" r="2" />
                    <circle cx="15" cy="12" r="2" />
                    <circle cx="8" cy="18" r="2" />
                </svg>
            </span>
            <h4 class="lul-uc__title">Districts, uses, dimensional requirements</h4>
            <p class="lul-uc__body">Housing types, nonresidential uses, setbacks, height limits, parking minimums.</p>
        </article>
        <!-- Standard GIS Vector — layered map -->
        <article class="lul-uc__card">
            <span class="lul-uc__icon">
                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.6"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                >
                    <path d="M9 4 3 6.5v13L9 17l6 3 6-2.5v-13L15 7 9 4Z" />
                    <path d="M9 4v13" />
                    <path d="M15 7v13" />
                </svg>
            </span>
            <h4 class="lul-uc__title">PDF report</h4>
            <p class="lul-uc__body">Formatted for due diligence, legal review, or planning analysis.</p>
        </article>
    </div>
</section>
