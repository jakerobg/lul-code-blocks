<!--
  Coverage Stats (2x2, LEFT-ALIGNED) — four square stat cards
  (Squarespace Code Block).

  Variant of coverage_stats.html. Differences: the grid tops out at TWO
  columns (never 4 across, however wide the block is) and is flush LEFT
  rather than centered. It still uses the same block-measured container
  logic, so it drops to a single column when the code block is too narrow
  for two. Use this when the stats sit beside other left-aligned content
  (body copy, a heading) and need to line up with it.

  All classes/vars are suffixed 2 (lul-cov2, --lul2-*) so this can share a
  page with coverage_stats.html without either one clobbering the other.

  Big count-up number fills each card; a smaller muted subheader sits
  beneath it. Numbers tick up from 0 → target the first time the block
  scrolls into view. Values come live from the zoning-atlas coverage API.

  ▶ CONFIG (top of the <script> below): SELECTED lists the 4 cards. Each
    is either a metric key (fetched live from METRICS) or a hardcoded
    { value, label } card.

  Self-contained; all classes prefixed lul-cov2- to avoid collisions.
-->
<section class="lul-cov2" aria-label="Data coverage statistics">
    <style>
        .lul-cov2 {
            --lul2-header: #594496;
            --lul2-card: #ffffff; /* grey card, matches research-band feel */
            --lul2-sub: #393348;

            /* ── TWEAKABLE SIZING ────────────────────────────────────────
               Everything you'd normally want to nudge lives here. */
            --lul2-num-size: 2.5rem; /* big count-up number (was 2.9rem) */
            /* Space between the LABEL and the NUMBER. Per-state, because the
               2x2 cards are taller and want more air than the stacked ones. */
            --lul2-num-gap-2col: 40px;
            --lul2-num-gap: var(--lul2-num-gap-2col);
            --lul2-card-pad-top: 20px; /* card padding: above the label */
            --lul2-card-pad-x: 20px; /* card padding: left + right */
            --lul2-card-pad-bottom: 20px; /* card padding: BELOW the number */
            --lul2-card-min-h: 120px; /* card height floor; lower = tighter card */
            --lul2-gap-2col: 25px; /* grid gap in the 2x2 state */
            --lul2-justify-2col: start; /* 2x2 sits flush left in the block */

            /* ── Stacked (1-column) overrides ────────────────────────────
               A stacked card is wider and shorter than a 2x2 one, so it needs
               less vertical room; the space under the number comes from BOTH
               the min-height floor and the bottom padding, so both drop here.

               --lul2-card-w-1col is the stacked card's fixed width: wider than
               the 180px used in the 2x2 state, but NOT stretched to the block's
               edge. That's the one to tweak. The minmax(0, …) wrapper only lets
               it shrink instead of overflowing on a very narrow block. */
            --lul2-card-w-1col: 160px;
            --lul2-track-1col: minmax(0, var(--lul2-card-w-1col));
            --lul2-gap-1col: 12px; /* grid gap when stacked */
            --lul2-justify-1col: center; /* stacked column centers in the block */
            --lul2-num-gap-1col: 12px; /* label-to-number gap when stacked */
            --lul2-card-pad-bottom-1col: 14px; /* bottom padding when stacked */
            --lul2-card-min-h-1col: 0px; /* 0 = card hugs its content */
            /* ─────────────────────────────────────────────────────────── */
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            color: var(--lul2-header);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            width: 100%;
            max-width: 100%;
            box-sizing: border-box;
            padding: 20px 0;
            /* never let the block paint outside its Squarespace container */
            overflow-x: clip;
        }
        .lul-cov2 *,
        .lul-cov2 *::before,
        .lul-cov2 *::after {
            box-sizing: border-box;
        }

        .lul-cov2__grid {
            display: grid;
            /* 2 columns MAX — never 4 across, no matter how wide the block is.
               Drops to 1 column when the block can't fit two.
               --lul2-cols is set by the ResizeObserver in the script below
               from the BLOCK's measured width. minmax(0, 180px) is the safety
               net: tracks shrink rather than overflowing past the code block. */
            grid-template-columns: repeat(var(--lul2-cols, 1), var(--lul2-track, minmax(0, 180px)));
            /* flush left in the 2x2 state, centered when stacked (see below) */
            justify-content: var(--lul2-justify, var(--lul2-justify-2col));
            gap: var(--lul2-gap, var(--lul2-gap-2col));
            width: 100%;
            max-width: 100%;
        }

        .lul-cov2__card {
            background: var(--lul2-card);
            border-radius: 0;
            padding: var(--lul2-card-pad-top) var(--lul2-card-pad-x) var(--lul2-card-pad-bottom);
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            min-height: var(--lul2-card-min-h);
            box-shadow: 2px 6px 10px rgba(57, 51, 72, 0.28);
            text-align: left;
            align-items: flex-start;
            border: solid 1px rgba(57, 51, 72, 0.3);
        }

        .lul-cov2__num {
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            font-weight: 400;
            font-size: var(--lul2-num-size);
            line-height: 1;
            letter-spacing: -0.03em;
            color: var(--lul2-header);
            /* Fixed gap under the label instead of `margin-top: auto`, which
               pushed the number to the card's bottom edge and made the gap a
               side effect of card height. Now the two sit together and
               --lul2-num-gap controls the spacing directly. */
            margin: var(--lul2-num-gap) 0 0 0;
        }
        .lul-cov2__plus {
            font-size: 0.6em; /* a little smaller than the number */
            font-weight: 400;
            margin-left: 0.15em;
            vertical-align: 0.5em;
        }

        /* transparent "ghost" tile — opt-in per hardcoded card via `accent: true`.
           For placement on a DARK background: no fill, a cream keyline + cream
           text so it reads as a different class of figure using one palette. */
        .lul-cov2__card--accent {
            background: transparent;
            /* inset ring instead of a real border, so it doesn't shift the
               content down by the border width like a border-box border would */
            box-shadow: inset 0 0 0 2px rgba(238, 236, 239, 0.45);
        }
        .lul-cov2__card--accent .lul-cov2__num {
            color: #eeecef;
        }
        .lul-cov2__card--accent .lul-cov2__sub {
            color: rgba(238, 236, 239, 0.78);
            opacity: 1;
        }
        .lul-cov2__card--accent .lul-cov2__plus {
            color: rgba(238, 236, 239, 0.6);
        }

        /* uppercase label — same treatment as uppercase_label.html.
           Sits at the TOP of the card; the number is pushed to the bottom. */
        .lul-cov2__sub {
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            line-height: 1.4;
            color: #393348;
            opacity: 0.8;
            margin: 0;
        }

        /* Stacked (1-column) state: tighten the grid gap AND the space under
           the number, so the four boxes read as one list instead of four tall
           drifting slabs. These vars are set on the grid but inherit down to
           the cards. data-cols is stamped on the section by setCols2. */
        .lul-cov2[data-cols="1"] .lul-cov2__grid {
            --lul2-track: var(--lul2-track-1col);
            --lul2-justify: var(--lul2-justify-1col);
            --lul2-gap: var(--lul2-gap-1col);
            --lul2-num-gap: var(--lul2-num-gap-1col);
            --lul2-card-pad-bottom: var(--lul2-card-pad-bottom-1col);
            --lul2-card-min-h: var(--lul2-card-min-h-1col);
        }

        /* Column count is decided in JS (see setCols2) — no @media or @container
           rules here, so nothing depends on the viewport or on how Squarespace
           wraps the code block. */
    </style>

    <div class="lul-cov2__grid" id="lul-cov2-grid"></div>

    <script>
        (function () {
            var root = document.currentScript.closest(".lul-cov2");
            if (!root) return;
            var grid = root.querySelector("#lul-cov2-grid");
            if (!grid) return;

            var API = "https://api.zoningatlas.org/nza_coverage";

            /* ════════════════════════════════════════════════════════════
               1) CHOOSE THE 4 CARDS (in display order). Each entry is either:
                    • a metric KEY (string) from the METRICS registry → fetched live
                    • a HARDCODED card object: { value: 90000000, label: "parcels" }
                      (optional per-card flags: plus:false, accent:true → transparent tile)
                  Mix and match, e.g. 3 live + 1 hardcoded, or all 4 live.
               ════════════════════════════════════════════════════════════ */
            var SELECTED = [{ value: 90000000, label: "parcels" }, "acres", "population", "pages"];

            /* Show the "+" marker after each number? true = on, false = off.
               A hardcoded card can override this with its own `plus:` property,
               e.g. { value: 186, label: "zoning rules offered", plus: false }. */
            var SHOW_PLUS = true;

            /* ════════════════════════════════════════════════════════════
               2) METRICS REGISTRY — every fetchable stat. Each shows the
                  raw `field` count as the big number (with K / M / B) and
                  `sub` as the uppercase label. `fallback` is used if the
                  live fetch fails.
               ════════════════════════════════════════════════════════════ */
            //   dp   = decimal places on the big number (0 = whole, 1 = tenths)
            //   unit = force "K" | "M" | "B" (omit = auto by magnitude)
            var METRICS = {
                population: {
                    field: "population_covered",
                    sub: "residents",
                    fallback: 216798958,
                    dp: 0,
                },
                acres: { field: "acres_covered", sub: "acres", fallback: 1416006966, dp: 1 },
                census_tracts: {
                    field: "tracts_covered",
                    sub: "census tracts",
                    fallback: 50547,
                    dp: 0,
                    unit: "K",
                },
                block_groups: { field: "blockgroups_covered", sub: "block groups", fallback: 142719, dp: 0 },
                jurisdictions: {
                    field: "jurisdictions_covered",
                    sub: "jurisdictions",
                    fallback: 10509,
                    dp: 1,
                    unit: "K",
                },
                pages: { field: "pages_analyzed", sub: "zoning pages", fallback: 1261957, dp: 1 },
                housing_units: {
                    field: "housing_units_covered",
                    sub: "housing units",
                    fallback: 92236215,
                    dp: 0,
                },
                slices: { field: "slices_total", sub: "slices", fallback: 169240, dp: 0 },
                districts: { field: "districts_published", sub: "zoning districts", fallback: 114355, dp: 0 },
            };

            var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

            // ── Number formatting ──────────────────────────────────────
            // Round to `dp` decimals; dp 0 → whole number, else drop trailing ".0".
            function roundDp(x, dp) {
                if (dp === 0) return String(Math.round(x));
                return (Math.round(x * 10) / 10).toFixed(1).replace(/\.0$/, "");
            }
            // Format a number with K / M / B. `dp` = decimal places (default 1).
            // `unit` (optional) forces "K" | "M" | "B"; otherwise it's picked by
            // magnitude, and anything under 100,000 is shown with commas.
            function abbr(n, dp, unit) {
                if (dp == null) dp = 1;
                var a = Math.abs(n);
                if (unit === "B" || (!unit && a >= 1e9)) return roundDp(n / 1e9, dp) + "B";
                if (unit === "M" || (!unit && a >= 1e6)) return roundDp(n / 1e6, dp) + "M";
                if (unit === "K" || (!unit && a > 99999)) return roundDp(n / 1e3, dp) + "K";
                return Math.round(n).toLocaleString("en-US");
            }
            // Number + a smaller trailing "+" (e.g. 216.8M+). `show` is the
            // per-card plus flag (defaults on if omitted).
            function withPlus(n, show, dp, unit) {
                if (show === false) return abbr(n, dp, unit);
                return abbr(n, dp, unit) + '<span class="lul-cov2__plus">+</span>';
            }

            // ── Build the cards from SELECTED ──────────────────────────
            // Each entry resolves to a def { field (null if hardcoded), sub, fallback, plus }.
            // `plus` defaults to SHOW_PLUS, but a hardcoded card can override it
            // per-card via a `plus: false` (or true) property.
            var defs = SELECTED.map(function (entry) {
                if (typeof entry === "string") {
                    var m = METRICS[entry];
                    if (!m) {
                        // unknown key → warn so the card isn't silently dropped
                        console.warn('[coverage_stats_2x2_left] unknown metric key: "' + entry + '"');
                        return null;
                    }
                    return {
                        field: m.field,
                        sub: m.sub,
                        fallback: m.fallback,
                        // per-metric plus override (falls back to global SHOW_PLUS)
                        plus: m.plus !== undefined ? m.plus : SHOW_PLUS,
                        dp: m.dp,
                        unit: m.unit,
                    };
                }
                return {
                    field: null,
                    sub: entry.label,
                    fallback: entry.value,
                    plus: entry.plus !== undefined ? entry.plus : SHOW_PLUS,
                    dp: entry.dp,
                    unit: entry.unit,
                    accent: entry.accent === true, // transparent ghost tile
                };
            }).filter(Boolean);

            var records = []; // { el, subEl, def, target }
            defs.forEach(function (def) {
                var card = document.createElement("article");
                card.className = "lul-cov2__card" + (def.accent ? " lul-cov2__card--accent" : "");
                var num = document.createElement("p");
                num.className = "lul-cov2__num";
                num.textContent = "—";
                var sub = document.createElement("p");
                sub.className = "lul-cov2__sub";
                card.appendChild(sub);
                card.appendChild(num);
                grid.appendChild(card);
                records.push({ el: num, subEl: sub, def: def, target: null });
            });

            // ── Fill each card from a data row (API row, or null → fallback) ──
            function num(row, field) {
                return field && row && typeof row[field] === "number" ? row[field] : null;
            }
            function populate(row) {
                records.forEach(function (rec) {
                    var def = rec.def;
                    var val = num(row, def.field);
                    if (val === null && typeof def.fallback === "number") val = def.fallback;
                    rec.subEl.textContent = def.sub;
                    rec.target = typeof val === "number" ? val : null;
                    if (rec.target === null) rec.el.textContent = "—";
                    else rec.el.innerHTML = withPlus(rec.target, def.plus, def.dp, def.unit);
                });
            }

            // ── Animation ──────────────────────────────────────────────
            function countUp(rec) {
                if (rec.target === null) return;
                var duration = 1000;
                var start = null;
                function frame(now) {
                    if (start === null) start = now;
                    var p = Math.min((now - start) / duration, 1);
                    var eased = 1 - Math.pow(1 - p, 3); // easeOutCubic
                    // number only while counting; the "+" appears once it lands
                    if (p < 1) {
                        rec.el.textContent = abbr(rec.target * eased, rec.def.dp, rec.def.unit);
                        requestAnimationFrame(frame);
                    } else {
                        rec.el.innerHTML = withPlus(rec.target, rec.def.plus, rec.def.dp, rec.def.unit);
                    }
                }
                requestAnimationFrame(frame);
            }

            var started = false;
            function begin() {
                if (started) return;
                started = true;

                if (reduce || !("IntersectionObserver" in window)) {
                    records.forEach(function (rec) {
                        if (rec.target !== null)
                            rec.el.innerHTML = withPlus(rec.target, rec.def.plus, rec.def.dp, rec.def.unit);
                    });
                    return;
                }
                var byEl = new Map();
                records.forEach(function (rec) {
                    byEl.set(rec.el, rec);
                });
                var io = new IntersectionObserver(
                    function (entries) {
                        entries.forEach(function (entry) {
                            if (entry.isIntersecting) {
                                countUp(byEl.get(entry.target));
                                io.unobserve(entry.target);
                            }
                        });
                    },
                    { threshold: 0.4 },
                );
                records.forEach(function (rec) {
                    io.observe(rec.el);
                });
            }

            // ── Responsive columns, measured off the BLOCK (not the viewport) ──
            // Same logic as coverage_stats.html, but capped at 2 columns: this
            // variant tops out at 2x2 and only ever drops to a single column.
            // Width needed for 2 across = 2*180 + 25 = 385.
            var CARD_W2 = 180,
                GAP2 = 25;
            function widthFor2(cols) {
                return cols * CARD_W2 + (cols - 1) * GAP2;
            }
            function setCols2() {
                // clientWidth excludes any scrollbar; padding here is vertical only
                var w = root.clientWidth || root.getBoundingClientRect().width || 0;
                if (!w) return;
                var cols = w >= widthFor2(2) ? 2 : 1;
                root.style.setProperty("--lul2-cols", cols);
                // drives the tighter stacked-state gap in the CSS above
                root.setAttribute("data-cols", cols);
            }
            setCols2();
            if ("ResizeObserver" in window) {
                // fires on block resize AND on the initial layout pass, which
                // covers Squarespace mounting/animating the block after load
                new ResizeObserver(setCols2).observe(root);
            } else {
                window.addEventListener("resize", setCols2);
                window.addEventListener("load", setCols2);
            }

            // ── Fetch live data, then animate (fall back on failure/timeout) ──
            var timer = setTimeout(function () {
                populate(null);
                begin();
            }, 2500);
            fetch(API, { headers: { Accept: "application/json" } })
                .then(function (r) {
                    if (!r.ok) throw new Error("HTTP " + r.status);
                    return r.json();
                })
                .then(function (data) {
                    var row = Array.isArray(data) ? data[0] : data;
                    populate(row || null);
                })
                .catch(function () {
                    populate(null); // keep hardcoded fallbacks where available
                })
                .then(function () {
                    clearTimeout(timer);
                    begin();
                });
        })();
    </script>
</section>
