<!--
  NZA coverage stats — three numbers in Bebas Neue with Arial labels, each
  number swept by an animated highlight.

  ▶ TO SWAP A VARIABLE: change data-field on that <span>. Nothing in the script
    needs touching. Available fields from /nza_coverage:

      jurisdictions_covered   jurisdictions_total
      population_covered      population_total
      acres_covered           acres_total
      housing_units_covered   pages_analyzed
      slices_total            districts_published
      tracts_covered          tracts_total
      blockgroups_covered     blockgroups_total

  ▶ TO ADD/REMOVE A STAT: copy or delete a .lul-nza-stat block, then match the
    column count in grid-template-columns. Spacing between stats is the second
    value of `gap` on .lul-nza-row.

  ▶ data-fallback is what shows if the API is unreachable, so the page never
    renders an empty slot. Update it when the real numbers move.

  ▶ NUMBER FORMAT: abbreviated with K / M / B, same rules as the
    coverage_stats blocks. Per-stat overrides on the <span>:
      data-dp="0|1"   decimal places (default 1; 0 = whole number)
      data-unit="K"   force a unit instead of picking one by magnitude
    e.g. 1337510 → "1.3M+", 11015 with data-unit="K" → "11K+".
    Anything under 100,000 falls back to comma grouping.

  ▶ Each number counts up 0 → target the first time it scrolls into view,
    then the highlight sweeps across it. The sweep waits for the count to
    finish so the swatch is sized to the final digits, not to a mid-count
    width. prefers-reduced-motion skips the count.

  ▶ COLOURS/SIZE: the vars at the top of .lul-nza-row.
-->
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet" />

<style>
    .lul-nza-row {
        /* Fixed, not fluid — the number never resizes, it just reflows to one
           column at the media query below. If you make this much larger, lower
           that breakpoint too: the longest value ("224,494,683+") is ~4.7em wide
           in Bebas Neue, so three of them plus the gaps need ~15em of room. */
        --nza-size: 4rem;
        --nza-color: #393348; /* number before the highlight passes */
        --nza-highlight: #00689a;
        --nza-on-highlight: #ffffff; /* number once the highlight is behind it */
        --nza-label: #000000;

        display: grid;
        /* auto, NOT 1fr. With 1fr each column is a full third of the row and the
           content floats centered inside it, so most of the space between the
           stats is leftover column — changing `gap` barely moves them. Sizing
           columns to their content and centering the row makes `gap` literal:
           the number below IS the distance between the stats. */
        grid-template-columns: repeat(3, auto);
        justify-content: center;
        gap: 28px 56px; /* row gap when stacked | space between columns */
        align-items: start;
        width: 100%;
        box-sizing: border-box;
    }
    /* Stacks here rather than shrinking the type. Viewport-based, so allow a
       little margin over the content width — see --nza-size. */
    @media (max-width: 920px) {
        .lul-nza-row {
            grid-template-columns: minmax(0, 1fr);
        }
    }
    .lul-nza-row *,
    .lul-nza-row *::before,
    .lul-nza-row *::after {
        box-sizing: border-box;
    }

    .lul-nza-stat {
        text-align: center;
    }

    /* The number stays INLINE so the highlight hugs the digits rather than the
       full column width; .lul-nza-stat does the centering. */
    .lul-nza {
        --d: 0s; /* per-stat stagger, set on the row below */
        display: inline;
        font-family: "Bebas Neue", "Helvetica Neue", Helvetica, Arial, sans-serif;
        font-size: var(--nza-size);
        line-height: 1;
        letter-spacing: 0.01em;
        color: var(--nza-color);
        font-variant-numeric: tabular-nums;

        /* Highlight is a non-repeating swatch grown 0 → full width, so it
           sweeps left-to-right across the number like a marker stroke. */
        background-image: linear-gradient(var(--nza-highlight), var(--nza-highlight));
        background-repeat: no-repeat;
        background-position: left center;
        background-size: 0% 100%;
        padding: 0.04em 0.14em;
        box-decoration-break: clone;
        -webkit-box-decoration-break: clone;
        transition:
            background-size 0.7s cubic-bezier(0.22, 1, 0.36, 1) var(--d),
            color 0.25s ease calc(var(--d) + 0.45s);
    }
    /* .is-lit is added once the number has rendered, so the swatch is sized to
       the final value rather than the placeholder. */
    .lul-nza.is-lit {
        background-size: 100% 100%;
        color: var(--nza-on-highlight);
    }
    .lul-nza-row > :nth-child(2) .lul-nza {
        --d: 0.12s;
    }
    .lul-nza-row > :nth-child(3) .lul-nza {
        --d: 0.24s;
    }

    .lul-nza-label {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 20px;
        line-height: 1.5;
        color: var(--nza-label);
        margin: 25px auto 0; /* gap between the number and its label */
        max-width: 22ch;
    }

    @media (prefers-reduced-motion: reduce) {
        .lul-nza {
            transition: none;
        }
    }
</style>

<div class="lul-nza-row">
    <div class="lul-nza-stat">
        <span class="lul-nza" data-field="jurisdictions_covered" data-fallback="11015" data-unit="K" data-dp="1"
            >11K+</span
        >
        <p class="lul-nza-label">Jurisdictions Published to the National Zoning Atlas</p>
    </div>

    <div class="lul-nza-stat">
        <span class="lul-nza" data-field="pages_analyzed" data-fallback="1337510" data-dp="1">1.3M+</span>
        <p class="lul-nza-label">Pages of Zoning Codes Read</p>
    </div>

    <div class="lul-nza-stat">
        <span class="lul-nza" data-field="population_covered" data-fallback="224494683" data-dp="0">224M+</span>
        <p class="lul-nza-label">People Living in Published Jurisdictions</p>
    </div>
</div>

<script>
    (function () {
        // One request per page no matter how many copies of this block are on
        // it — the first to run owns the promise, the rest await the same one.
        window.__lulNza =
            window.__lulNza ||
            fetch("https://api.zoningatlas.org/nza_coverage", {
                headers: { Accept: "application/vnd.pgrst.object+json" },
            })
                .then(function (r) {
                    if (!r.ok) throw new Error("HTTP " + r.status);
                    return r.json();
                })
                // PostgREST returns a bare object with the Accept header above and
                // a one-item array without it. Accept either.
                .then(function (d) {
                    return Array.isArray(d) ? d[0] : d;
                });

        var nodes = document.querySelectorAll(".lul-nza:not([data-lul-nza-done])");
        if (!nodes.length) return;

        var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

        // ── Number formatting (same rules as the coverage_stats blocks) ──
        // Round to `dp` decimals; dp 0 → whole number, else drop trailing ".0".
        function roundDp(x, dp) {
            if (dp === 0) return String(Math.round(x));
            return (Math.round(x * 10) / 10).toFixed(1).replace(/\.0$/, "");
        }
        // Format with K / M / B. `dp` = decimal places (default 1). `unit`
        // (optional) forces "K" | "M" | "B"; otherwise it's picked by
        // magnitude, and anything under 100,000 is shown with commas.
        function abbr(n, dp, unit) {
            if (dp == null) dp = 1;
            var a = Math.abs(n);
            if (unit === "B" || (!unit && a >= 1e9)) return roundDp(n / 1e9, dp) + "B";
            if (unit === "M" || (!unit && a >= 1e6)) return roundDp(n / 1e6, dp) + "M";
            if (unit === "K" || (!unit && a > 99999)) return roundDp(n / 1e3, dp) + "K";
            return Math.round(n).toLocaleString("en-US");
        }
        // Per-stat overrides from the markup: data-dp / data-unit.
        function fmt(el, n) {
            var dp = el.dataset.dp === undefined ? null : parseInt(el.dataset.dp, 10);
            return abbr(n, isNaN(dp) ? null : dp, el.dataset.unit || null);
        }

        // ── Count up, then sweep the highlight ─────────────────────────
        // The swatch is sized to the element's box, so it's lit only once the
        // number has landed on its final width — otherwise it would resize
        // under the digits while they tick.
        function light(el) {
            // Next frame, so the browser paints the 0%-width swatch before the
            // class change animates it — set in the same frame it would jump.
            requestAnimationFrame(function () {
                requestAnimationFrame(function () {
                    el.classList.add("is-lit");
                });
            });
        }
        function countUp(el, target) {
            if (reduce) {
                el.textContent = fmt(el, target) + "+";
                light(el);
                return;
            }
            var duration = 1000;
            var start = null;
            requestAnimationFrame(function frame(now) {
                if (start === null) start = now;
                var p = Math.min((now - start) / duration, 1);
                var eased = 1 - Math.pow(1 - p, 3); // easeOutCubic
                // number only while counting; the "+" appears once it lands
                if (p < 1) {
                    el.textContent = fmt(el, target * eased);
                    requestAnimationFrame(frame);
                } else {
                    el.textContent = fmt(el, target) + "+";
                    light(el);
                }
            });
        }

        // Hold the resolved value until the stat scrolls into view.
        function arm(el, value) {
            el.setAttribute("data-lul-nza-done", "1");
            var target = Number(value);
            if (isNaN(target)) return;
            if (!("IntersectionObserver" in window)) {
                countUp(el, target);
                return;
            }
            var io = new IntersectionObserver(
                function (entries) {
                    entries.forEach(function (entry) {
                        if (entry.isIntersecting) {
                            io.unobserve(entry.target);
                            countUp(el, target);
                        }
                    });
                },
                { threshold: 0.4 },
            );
            io.observe(el);
        }

        window.__lulNza
            .then(function (data) {
                nodes.forEach(function (el) {
                    var v = data[el.dataset.field];
                    arm(el, v == null ? el.dataset.fallback : v);
                });
            })
            .catch(function () {
                // Leave the hardcoded fallback in place rather than blanking it.
                nodes.forEach(function (el) {
                    arm(el, el.dataset.fallback);
                });
            });
    })();
</script>
