<!-- Local preview only. Squarespace already carries styles/lul.css in Custom
     CSS; this line just makes the block render correctly on its own. -->
<link rel="stylesheet" href="styles/lul.css">

<style>
    .lul-dicts {
        --lul-header: #393348;
        --lul-text: #333333;
        --lul-card: #ffffff;
        /* card outline + inner padding, matching explore_products_NEW.html */
        --lul-card-border: rgba(57, 51, 72, 0.15);
        --lul-card-border-hover: rgba(57, 51, 72, 0.4);
        --lul-card-shadow: none;
        --lul-card-shadow-hover: 0 6px 28px rgba(57, 51, 72, 0.1);
        --lul-card-pad: 40px;
        /* secondary (outlined) button, same as .lul-pgrid__btn in
           product_splash/product_grid.html */
        /* space between the card title and its button */
        /* Fixed card width. Five across need 5 x 300 + 4 x 24 gap + the
           grid's 30px of side padding = 1626, which is what sets the grid's
           1640px cap below. Under that they wrap a card at a time rather than
           stretching. */
        --lul-card-w: 300px;
        --lul-title-gap: 28px;
        --lul-btn-ink: #393348;
        --lul-btn-hover: #f9f9f9;
        --lul-bg: rgb(239, 237, 236);
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        color: var(--lul-text);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        max-width: none;
        width: 100%;
        margin: 0;
        padding: 8px 0;
        box-sizing: border-box;
        /* so the one-column breakpoint below measures this block, not the
           window — the column count is decided by the block's width */
        container-type: inline-size;
        container-name: luldicts;
    }
    .lul-dicts *,
    .lul-dicts *::before,
    .lul-dicts *::after {
        box-sizing: border-box;
    }

    /* Fixed-width tracks, not 1fr. With 1fr the cards — and so the graphics
       inside them — grew and shrank continuously with the window. Capping the
       track at --lul-card-w keeps every card, and every graphic, the same size
       at any width; the row simply drops a card to the next line when it runs
       out of room. minmax(0, …) is what stops them overflowing once the block
       is narrower than a single card. */
    .lul-dicts__grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(0, var(--lul-card-w)));
        justify-content: center;
        gap: 24px;
        max-width: 1640px; /* 5 x 300 + 4 x 24 gap + 30 padding = 1626 */
        margin: 0 auto;
        padding: 12px 15px 16px;
    }

    .lul-card {
        background: var(--lul-card);
        border: 1px solid var(--lul-card-border);
        border-radius: 0;
        /* visible, not hidden — the dropdown menus on two of these cards have
           to escape the card box */
        overflow: visible;
        display: flex;
        flex-direction: column;
        position: relative;
        transition:
            transform 0.25s ease,
            border-color 0.25s ease,
            box-shadow 0.25s ease;
        box-shadow: var(--lul-card-shadow);
    }
    .lul-card:hover {
        transform: translateY(-2px);
        border-color: var(--lul-card-border-hover);
        box-shadow: var(--lul-card-shadow-hover);
    }
    /* three of the cards are themselves links — stop the theme colouring and
       underlining the title inside them */
    a.lul-card,
    a.lul-card:visited,
    a.lul-card:hover {
        color: inherit;
        text-decoration: none;
    }
    .lul-card:has(.lul-dx__dropdown.lul-dx-open) {
        z-index: 100;
    }

    .lul-card__media {
        width: 100%;
        aspect-ratio: 4 / 3;
        overflow: hidden;
        position: relative;
        background: #ffffff;
        padding: var(--lul-card-pad) var(--lul-card-pad) 0;
    }
    .lul-card__img {
        width: 100%;
        height: 100%;
        /* contain = show the whole graphic, never crop it */
        object-fit: contain;
        /* sits the graphic on the bottom edge of the frame */
        object-position: center bottom;
        display: block;
    }

    .lul-card__body {
        padding: 28px var(--lul-card-pad) 30px;
        display: flex;
        flex-direction: column;
        flex: 1;
    }
    .lul-card__title {
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        font-size: 25px;
        font-weight: 500;
        color: var(--lul-header);
        /* No description on these cards, so this gap is the only thing between
           the title and the button. flex: 1 below means it's a MINIMUM — on a
           row of equal-height cards a short title gets more. */
        margin: 0 0 var(--lul-title-gap);
        letter-spacing: -0.01em;
        line-height: 1.25;
        /* allow the title to wrap to a second line instead of truncating */
        white-space: normal;
        overflow-wrap: break-word;
        flex: 1;
    }
    .lul-card__action {
        align-self: stretch;
    }

    /* Secondary (outlined) button. On the three cards that are themselves
       links this is a <span> — the card carries the href — so its hover state
       is driven by the card, not by the button. */
    .lul-card__btn {
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        display: block;
        text-align: center;
        font-size: var(--lul-size-cta-compact);
        font-weight: 500;
        letter-spacing: 0.02em;
        padding: 8px 14px;
        border: 1px solid var(--lul-btn-ink);
        border-radius: 0;
        background: transparent;
        color: var(--lul-btn-ink);
        text-decoration: none;
        cursor: pointer;
        transition:
            background 0.25s ease,
            border-color 0.25s ease;
    }
    .lul-card:hover .lul-card__btn {
        background: var(--lul-btn-hover);
    }

    /* dropdown buttons (data_sample / raster dropdown style), full width inside cards */
    .lul-dicts .lul-dx-actions {
        display: block !important;
        width: 100% !important;
        gap: 0;
    }
    .lul-dicts .lul-dx-actions .lul-dx__dropdown {
        position: relative;
        display: block !important;
        width: 100% !important;
    }
    /* The same secondary button, used as a menu toggle on the two cards that
       point at several sheets. It keeps a chevron — that one is meaningful,
       not decoration: it says this opens rather than navigates. */
    .lul-dicts .lul-dx-actions .lul-dx__btn {
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        font-size: var(--lul-size-cta-compact);
        font-weight: 500;
        letter-spacing: 0.02em;
        padding: 8px 14px;
        border: 1px solid var(--lul-btn-ink);
        border-radius: 0;
        background: transparent;
        color: var(--lul-btn-ink);
        text-decoration: none;
        cursor: pointer;
        transition:
            background 0.25s ease,
            border-color 0.25s ease;
    }
    .lul-dicts .lul-dx-actions .lul-dx__btn:hover,
    .lul-card:hover .lul-dx-actions .lul-dx__btn {
        background: var(--lul-btn-hover);
    }
    .lul-dicts .lul-dx-actions .lul-dx__btn svg {
        width: 16px;
        height: 16px;
        flex: none;
    }
    .lul-dicts .lul-dx-actions .lul-dx__dropdown.lul-dx-open .lul-dx__btn svg {
        transform: rotate(180deg);
    }
    .lul-dicts .lul-dx-actions .lul-dx__menu {
        position: absolute;
        top: calc(100% - 1px);
        left: 0;
        min-width: 100%;
        background: #ffffff;
        border: 1px solid #393348;
        z-index: 50;
        display: none;
        flex-direction: column;
    }
    .lul-dicts .lul-dx-actions .lul-dx__dropdown.lul-dx-open .lul-dx__menu {
        display: flex;
    }
    .lul-dicts .lul-dx-actions .lul-dx__option {
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 0.95rem;
        color: #393348;
        text-decoration: none;
        white-space: nowrap;
        padding: 14px 26px;
        border-bottom: 1px solid rgba(57, 51, 72, 0.15);
        transition:
            background 0.2s ease,
            color 0.2s ease;
    }
    .lul-dicts .lul-dx-actions .lul-dx__option:last-child {
        border-bottom: none;
    }
    .lul-dicts .lul-dx-actions .lul-dx__option:hover {
        background: #393348;
        color: #ffffff;
    }

    /* ── ONE COLUMN ──
       Two cards need 2 x 300 + 24 gap + 30 padding = 654px, so below that the
       grid is already down to a single card per row and the title has the
       full card width to itself. Nothing about the padding or the gap changes
       here — those were stepping at a different width from the column count,
       which read as a jump. */
    @container luldicts (max-width: 653px) {
        .lul-card__title {
            font-size: 1.4rem;
        }
    }
</style>

<script>
    (function () {
        var dropdowns = document.querySelectorAll(".lul-dicts .lul-dx-actions .lul-dx__dropdown");
        dropdowns.forEach(function (dd) {
            var toggle = dd.querySelector(".lul-dx__toggle");
            toggle.addEventListener("click", function (e) {
                e.preventDefault();
                e.stopPropagation();
                var isOpen = dd.classList.contains("lul-dx-open");
                dropdowns.forEach(function (other) {
                    other.classList.remove("lul-dx-open");
                });
                if (!isOpen) dd.classList.add("lul-dx-open");
            });
        });
        document.addEventListener("click", function () {
            dropdowns.forEach(function (dd) {
                dd.classList.remove("lul-dx-open");
            });
        });
    })();
</script>
