<!--
  Zoning data for [sector] — SCROLLABLE variant of data_built_for_sectors.html.

  Same 5-row peek reel with the faded top/bottom edges, but the reel is a real
  scroll container with CSS scroll-snap instead of a transform. That means the
  user can take over at any time — mouse wheel, trackpad, touch drag, or arrow
  keys once it has focus — and each sector snaps to the center. The auto-advance
  pauses the moment they interact and resumes after RESUME_MS of stillness.

  The list is cloned to COPIES sets so it loops endlessly: when the scroll
  position drifts out of the middle copies we jump it back by one cycle, which
  is invisible because the content is identical.

  ▶ HEADS UP on wheel behaviour: because the list never reaches an end, wheeling
    with the cursor over the reel scrolls the SECTORS, not the page. If that
    feels like a trap, set LOOP = false below — the list then has real ends, the
    page scrolls normally once you hit them, and the auto-advance ping-pongs
    up and down instead of looping.

  Hovering a sector turns it sage-green and underlines it.

  ▶ Tuning: --scz-h = row height/step. --scz-dim = neighbour opacity.
    --scz-ul-y = how low the hover underline sits. The mask gradient on
    .lul-sczs__carousel controls the edge fade. STEP_MS / RESUME_MS in the
    script = auto-advance cadence and how long to wait after the user stops.
-->
<section class="lul-sczs" aria-label="Zoning data for your sector">
    <style>
        .lul-sczs {
            --lul-header: #393348;
            --lul-accent: #97a24f; /* sage-green used on hover */
            --scz-h: 1.5em; /* one sector row height / scroll step */
            --scz-dim: 0.7; /* previous/next sector opacity (raise = darker) */
            --scz-ul-y: 0.16em; /* how far below the text the hover underline sits */
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            color: var(--lul-header);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            width: 100%;
            box-sizing: border-box;
            padding: 6px 4px 6px;
            text-align: center;
        }
        .lul-sczs *,
        .lul-sczs *::before,
        .lul-sczs *::after {
            box-sizing: border-box;
        }

        /* flex keeps the label + reel on one line and vertically centers the
           reel, so the CURRENT (center) sector lines up with the label. */
        .lul-sczs__headline {
            display: flex;
            justify-content: left;
            align-items: center;
            gap: 0.6em;
            white-space: nowrap;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            font-weight: 500;
            font-size: clamp(1.4rem, 4.2vw, 2rem);
            line-height: 1.1;
            letter-spacing: -0.02em;
            margin: 0;
            color: var(--lul-header);
        }

        /* 5-row scroll window: two above / current / two below, edges masked.
           This is a genuine scroll container — snapping, wheel, drag and arrow
           keys all come from the browser. */
        .lul-sczs__carousel {
            display: block;
            height: calc(var(--scz-h) * 5);
            overflow-x: hidden;
            overflow-y: auto;
            scroll-snap-type: y mandatory;
            touch-action: pan-y;
            /* hide the scrollbar without losing scrollability */
            scrollbar-width: none;
            -ms-overflow-style: none;
            -webkit-mask-image: linear-gradient(
                to bottom,
                transparent 0%,
                rgba(0, 0, 0, 0.22) 18%,
                rgba(0, 0, 0, 1) 30%,
                rgba(0, 0, 0, 1) 70%,
                rgba(0, 0, 0, 0.22) 82%,
                transparent 100%
            );
            mask-image: linear-gradient(
                to bottom,
                transparent 0%,
                rgba(0, 0, 0, 0.22) 18%,
                rgba(0, 0, 0, 1) 30%,
                rgba(0, 0, 0, 1) 70%,
                rgba(0, 0, 0, 0.22) 82%,
                transparent 100%
            );
        }
        .lul-sczs__carousel::-webkit-scrollbar {
            display: none;
        }
        .lul-sczs__carousel:focus-visible {
            outline: 2px solid var(--lul-accent);
            outline-offset: 3px;
        }

        /* Two blank rows top and bottom, so the FIRST and LAST sector can still
           sit in the middle of the five-row window. */
        .lul-sczs__pad {
            display: block;
            height: calc(var(--scz-h) * 2);
        }
        /* These are spans (a valid child of an h1) so they need block display. */
        .lul-sczs__list {
            display: block;
        }

        .lul-sczs__item {
            display: block;
            height: var(--scz-h);
            line-height: var(--scz-h);
            white-space: nowrap; /* each sector always on one line */
            text-align: left; /* every sector starts at the same x */
            scroll-snap-align: center; /* snaps this row to the middle */
            opacity: var(--scz-dim); /* neighbours dimmed... */
            transition: opacity 0.4s ease;
        }
        .lul-sczs__item.is-current {
            opacity: 1; /* ...current sector full-strength */
        }
        /* Held on for the instant of the seamless-loop jump, so the row landing
           in the center does not fade up from dim and read as a flicker. */
        .lul-sczs--nofade .lul-sczs__item {
            transition: none;
        }
        .lul-sczs__word {
            color: inherit;
            text-decoration: none;
            font-style: italic;
        }
        /* Hover turns it sage-green and adds a plain link underline — no
           animation, sat slightly low. */
        .lul-sczs__word:hover {
            color: var(--lul-accent);
            text-decoration: underline;
            text-underline-offset: var(--scz-ul-y);
        }

        @media (max-width: 800px) {
            .lul-sczs {
                padding: 6px 4px 6px;
            }
            /* smaller floor so the widest sentence still fits one line on phones */
            .lul-sczs__headline {
                font-size: clamp(1.2rem, 4.6vw, 1.8rem);
            }
        }
    </style>

    <h1 class="lul-sczs__headline">
        <!-- <span class="lul-sczs__label">Powering</span> -->
        <span class="lul-sczs__carousel" tabindex="0" aria-label="Sectors we serve — scroll to browse">
            <span class="lul-sczs__pad" aria-hidden="true"></span>
            <!-- The six sectors, authored once. The script clones this set so the
                 reel can loop; without JS it stays a plain scrollable list. -->
            <span class="lul-sczs__list">
                <span class="lul-sczs__item"
                    ><a class="lul-sczs__word" href="/financial-services">Financial Services Professionals</a></span
                >
                <span class="lul-sczs__item"><a class="lul-sczs__word" href="/developers">Developers</a></span>
                <span class="lul-sczs__item"><a class="lul-sczs__word" href="/policymakers">Policymakers</a></span>
                <span class="lul-sczs__item"><a class="lul-sczs__word" href="/owners">Property Owners</a></span>
                <span class="lul-sczs__item"
                    ><a class="lul-sczs__word" href="/real-estate">Real Estate Professionals</a></span
                >
                <span class="lul-sczs__item"><a class="lul-sczs__word" href="/researchers">Researchers</a></span>
            </span>
            <span class="lul-sczs__pad" aria-hidden="true"></span>
        </span>
    </h1>

    <script>
        (function () {
            var root = document.currentScript.closest(".lul-sczs");
            if (!root) return;
            var reel = root.querySelector(".lul-sczs__carousel");
            var list = root.querySelector(".lul-sczs__list");
            if (!reel || !list) return;

            var LOOP = true; // false = real ends + ping-pong (page scroll chains)
            var COPIES = 5; // how many sets of the list when looping
            var STEP_MS = 2200; // time between auto-advances
            var RESUME_MS = 2500; // stillness required before auto resumes

            var N = list.children.length; // 6 real sectors
            if (!N) return;

            // Clone the list up to COPIES sets so a jump of one cycle is invisible.
            if (LOOP) {
                var proto = list.cloneNode(true);
                for (var c = 1; c < COPIES; c++) {
                    list.parentNode.insertBefore(proto.cloneNode(true), list.nextSibling);
                }
            }
            var rows = root.querySelectorAll(".lul-sczs__item");
            var total = rows.length;

            // Row height is em-based, so read it rather than assume it.
            function rowH() {
                return rows[0].getBoundingClientRect().height || 1;
            }
            // scrollTop = i * rowH() centers row i (that is what the two blank
            // pad rows above the list buy us).
            function indexAt() {
                return Math.round(reel.scrollTop / rowH());
            }

            // Start in the middle copy so there is room to drift both ways.
            var START = LOOP ? Math.floor(COPIES / 2) * N : 0;
            var current = -1;
            var userActive = false;
            var resumeTimer = null;
            var autoTimer = null;
            var ticking = false;
            var dir = 1; // only used when LOOP is false

            function setCurrent(i) {
                if (i === current) return;
                current = i;
                for (var k = 0; k < total; k++) {
                    rows[k].classList.toggle("is-current", k === i);
                }
            }

            // Pull the position back into the middle copies. Content is identical
            // one cycle away, so this is invisible — but freeze the transitions
            // so the newly centered row does not animate its colour/opacity.
            function maybeWrap() {
                if (!LOOP) return;
                var h = rowH();
                var i = indexAt();
                if (i >= N && i <= total - N - 1) return;

                root.classList.add("lul-sczs--nofade");
                while (i < N) {
                    reel.scrollTop += N * h;
                    i = indexAt();
                }
                while (i > total - N - 1) {
                    reel.scrollTop -= N * h;
                    i = indexAt();
                }
                setCurrent(indexAt());
                void reel.offsetHeight; // flush untransitioned
                root.classList.remove("lul-sczs--nofade");
            }

            function onScroll() {
                if (ticking) return;
                ticking = true;
                window.requestAnimationFrame(function () {
                    ticking = false;
                    setCurrent(indexAt());
                });
            }

            // ---- auto-advance -------------------------------------------------
            function step() {
                if (userActive) return;
                maybeWrap(); // only ever called while nothing is animating

                var i = indexAt();
                if (LOOP) {
                    i += 1;
                } else {
                    if (i >= total - 1) dir = -1;
                    else if (i <= 0) dir = 1;
                    i += dir;
                }
                reel.scrollTo({ top: i * rowH(), behavior: "smooth" });
            }
            function startAuto() {
                stopAuto();
                autoTimer = setInterval(step, STEP_MS);
            }
            function stopAuto() {
                if (autoTimer) clearInterval(autoTimer);
                autoTimer = null;
            }

            // ---- user takeover ------------------------------------------------
            // Explicit input events are the only reliable way to tell a user
            // gesture from our own smooth scrollTo, which also fires 'scroll'.
            function takeOver() {
                userActive = true;
                stopAuto();
                if (resumeTimer) clearTimeout(resumeTimer);
                resumeTimer = setTimeout(function () {
                    userActive = false;
                    maybeWrap(); // safe: the user has stopped, nothing animating
                    startAuto();
                }, RESUME_MS);
            }
            ["wheel", "touchstart", "pointerdown", "keydown"].forEach(function (evt) {
                reel.addEventListener(evt, takeOver, { passive: true });
            });
            // Keep pushing the resume deadline out while their scroll settles.
            reel.addEventListener(
                "scroll",
                function () {
                    onScroll();
                    if (userActive) takeOver();
                },
                { passive: true }
            );

            function realign() {
                reel.scrollTop = indexAt() * rowH();
            }
            // Font size is vw-based, so the row height changes with the window.
            window.addEventListener("resize", realign);
            // The web font can land after first paint and change the row height,
            // which would leave the reel sitting between two rows.
            if (document.fonts && document.fonts.ready) document.fonts.ready.then(realign);

            // ---- init ----------------------------------------------------------
            window.requestAnimationFrame(function () {
                root.classList.add("lul-sczs--nofade");
                reel.scrollTop = START * rowH();
                setCurrent(indexAt());
                void reel.offsetHeight;
                root.classList.remove("lul-sczs--nofade");

                var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
                if (!reduce) startAuto(); // reduced motion: still scrollable, just not self-advancing
            });
        })();
    </script>
</section>
