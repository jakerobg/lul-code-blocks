<!--
  Coverage Stats — PRODUCT / COMPACT (Squarespace Code Block).

  Root-directory version of product_pages/coverage_stats_PRODUCT.html:
  big count-up number with a small uppercase label above it, on a white
  card. Numbers tick up from 0 → target the first time the block scrolls
  into view. Values come live from the zoning-atlas coverage API.

  Differences from the PRODUCT original:
    • Everything is a little SMALLER and CLOSER TOGETHER — sized for a
      narrow code block (see the TWEAKABLE SIZING block below).
    • Cards are back: white tile + keyline + shadow, same treatment as
      coverage_stats.html. The band behind them is transparent by default
      — set --lulp-bg to #393348 for the PRODUCT original's dark band.
    • Two layouts only: 4 ACROSS on one line when the block is wide
      enough, otherwise 2x2. It NEVER drops to a single column — on a very
      narrow block the 2x2 cards shrink instead. See COL_STEPS.
    • Layout is measured off the BLOCK's own width (ResizeObserver), the
      same approach as coverage_stats.html in this folder — not off the
      viewport — so it reflows to the code block it's dropped into.

  ▶ CONFIG (top of the <script> below): SELECTED lists the cards. Each
    is either a metric key (fetched live from METRICS) or a hardcoded
    { value, label } card.

  All classes/vars are prefixed lul-covp- / --lulp- so this can share a
  page with the other coverage_stats blocks without clobbering them.
-->
<section class="lul-covp" aria-label="Data coverage statistics">
    <style>
        .lul-covp {
            /* ── COLOUR ──────────────────────────────────────────────────
               Cards match coverage_stats.html: white tile, dark text.
               --lulp-bg is the band BEHIND the cards; set it to #393348 for
               the dark band the PRODUCT original used. */
            --lulp-bg: transparent;
            --lulp-card-bg: #ffffff;
            --lulp-num-color: #594496;
            --lulp-label-color: #393348;
            --lulp-card-border: 1px solid rgba(57, 51, 72, 0.3);
            --lulp-card-shadow: 2px 6px 10px rgba(57, 51, 72, 0.28);

            /* ── TWEAKABLE SIZING ────────────────────────────────────────
               Tuned down from the PRODUCT original (values in comments)
               for a smaller code block. Everything worth nudging is here. */
            --lulp-card-w: 150px; /* column width (was 180px) */
            --lulp-gap-x: 16px; /* space BETWEEN columns (was 25px) */
            --lulp-gap-y: 18px; /* space BETWEEN rows (was 25px) */
            --lulp-num-size: 2.2rem; /* big number (was 2.9rem) */
            --lulp-label-size: 11px; /* uppercase label (was 12px) */
            --lulp-num-gap: 6px; /* label → number gap */
            --lulp-card-pad-top: 16px; /* card padding: above the label */
            --lulp-card-pad-x: 16px; /* card padding: left + right */
            --lulp-card-pad-bottom: 16px; /* card padding: below the number */
            --lulp-card-min-h: 0px; /* height floor; 0 = card hugs its content */
            --lulp-band-pad-y: 16px; /* space above/below the whole band (was 20px) */

            /* ── SMALL-BLOCK STEP DOWN ───────────────────────────────────
               Below --lulp-small-at the type drops one stop so a long number
               (e.g. 1,261,957 → 1.3M+) doesn't bleed past the card edge.
               Still 2x2 — this only changes the type and side padding. */
            --lulp-small-at: 300px; /* block width that triggers the step down */
            --lulp-num-size-sm: 1.7rem; /* number when small (from 2.2rem) */
            --lulp-label-size-sm: 10px; /* label when small (from 11px) */
            --lulp-card-pad-x-sm: 12px; /* side padding when small (from 16px) */
            /* ─────────────────────────────────────────────────────────── */

            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            color: var(--lulp-num-color);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            width: 100%;
            max-width: 100%;
            box-sizing: border-box;
            padding: var(--lulp-band-pad-y) 0;
            background: var(--lulp-bg);
            /* never let the block paint outside its Squarespace container */
            overflow-x: clip;
        }
        .lul-covp *,
        .lul-covp *::before,
        .lul-covp *::after {
            box-sizing: border-box;
        }

        .lul-covp__grid {
            display: grid;
            /* Either 4 across (one line, on a wide block) or 2x2 — never 1
               column. --lulp-cols is set by the ResizeObserver in the script
               below from the BLOCK's measured width. minmax(0, …) is the
               safety net: on a very narrow block the two tracks SHRINK, so it
               stays 2x2 instead of overflowing past the code block's edge. */
            grid-template-columns: repeat(var(--lulp-cols, 2), minmax(0, var(--lulp-card-w)));
            justify-content: center;
            column-gap: var(--lulp-gap-x);
            row-gap: var(--lulp-gap-y);
            width: 100%;
            max-width: 100%;
        }

        /* White tile, same treatment as coverage_stats.html */
        .lul-covp__card {
            background: var(--lulp-card-bg);
            border: var(--lulp-card-border);
            box-shadow: var(--lulp-card-shadow);
            border-radius: 0;
            padding: var(--lulp-card-pad-top) var(--lulp-card-pad-x) var(--lulp-card-pad-bottom);
            min-height: var(--lulp-card-min-h);
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            /* Label and number are both flush left inside the card, so the
               label's left edge lines up with the first digit. The grid still
               centers the row of cards as a whole. */
            text-align: left;
            align-items: flex-start;
        }

        .lul-covp__num {
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            font-weight: 400;
            font-size: var(--lulp-num-size);
            line-height: 1;
            letter-spacing: -0.03em;
            color: var(--lulp-num-color);
            margin: 0;
        }
        .lul-covp__plus {
            font-size: 0.6em; /* a little smaller than the number */
            font-weight: 400;
            margin-left: 0.15em;
            vertical-align: 0.5em;
        }

        /* transparent "ghost" tile — opt-in per hardcoded card via `accent: true`.
           For placement on a DARK band: no fill, a cream keyline + cream text. */
        .lul-covp__card--accent {
            background: transparent;
            border: none;
            /* inset ring instead of a real border, so it doesn't shift the
               content down by the border width like a border-box border would */
            box-shadow: inset 0 0 0 2px rgba(238, 236, 239, 0.45);
        }
        .lul-covp__card--accent .lul-covp__num {
            color: #eeecef;
        }
        .lul-covp__card--accent .lul-covp__sub {
            color: rgba(238, 236, 239, 0.78);
            opacity: 1;
        }
        .lul-covp__card--accent .lul-covp__plus {
            color: rgba(238, 236, 239, 0.6);
        }

        /* uppercase label — sits at the TOP of the card, number beneath. */
        .lul-covp__sub {
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            font-size: var(--lulp-label-size);
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            line-height: 1.4;
            color: var(--lulp-label-color);
            opacity: 0.85;
            margin: 0 0 var(--lulp-num-gap) 0;
        }

        /* Small-block state: data-size="sm" is stamped on the section by
           setColsP when the block is narrower than --lulp-small-at. Setting
           the vars here overrides the defaults above (attribute selector wins
           on specificity) and they inherit down to the cards. */
        .lul-covp[data-size="sm"] {
            --lulp-num-size: var(--lulp-num-size-sm);
            --lulp-label-size: var(--lulp-label-size-sm);
            --lulp-card-pad-x: var(--lulp-card-pad-x-sm);
        }

        /* Column count is decided in JS (see setColsP) — no @media or
           @container rules here, so nothing depends on the viewport or on how
           Squarespace wraps the code block. */
    </style>

    <div class="lul-covp__grid" id="lul-covp-grid"></div>

    <script>
        (function () {
            var root = document.currentScript.closest(".lul-covp");
            if (!root) return;
            var grid = root.querySelector("#lul-covp-grid");
            if (!grid) return;

            var API = "https://api.zoningatlas.org/nza_coverage";

            /* ════════════════════════════════════════════════════════════
               1) CHOOSE THE CARDS (in display order). Each entry is either:
                    • a metric KEY (string) from the METRICS registry → fetched live
                    • a HARDCODED card object: { value: 90000000, label: "parcels" }
                      (optional per-card flags: plus:false, accent:true)
                  Mix and match, e.g. 3 live + 1 hardcoded, or all live.
               ════════════════════════════════════════════════════════════ */
            var SELECTED = [{ value: 90000000, label: "parcels", plus: true }, "acres", "population", "pages"];

            /* Column counts this block is allowed to use, WIDEST FIRST. The
               first one that fits the block wins; the LAST entry is the floor,
               used even when it doesn't fit (the cards shrink instead). So
               [4, 2] = one line on a wide block, 2x2 otherwise, never 1 across.
               Add 3 if you ever want a 3-across tier. */
            var COL_STEPS = [4, 2];

            /* Show the "+" marker after each number? true = on, false = off.
               A hardcoded card can override this with its own `plus:` property,
               e.g. { value: 186, label: "zoning rules offered", plus: false }. */
            var SHOW_PLUS = true;

            /* ════════════════════════════════════════════════════════════
               2) METRICS REGISTRY — every fetchable stat. Each shows the
                  raw `field` count as the big number (with K / M / B) and
                  `sub` as the uppercase label. `fallback` is used if the
                  live fetch fails.
               ════════════════════════════════════════════════════════════ */
            //   dp   = decimal places on the big number (0 = whole, 1 = tenths)
            //   unit = force "K" | "M" | "B" (omit = auto by magnitude)
            var METRICS = {
                population: {
                    field: "population_covered",
                    sub: "residents",
                    fallback: 216798958,
                    dp: 0,
                },
                acres: { field: "acres_covered", sub: "acres", fallback: 1416006966, dp: 1 },
                census_tracts: {
                    field: "tracts_covered",
                    sub: "census tracts",
                    fallback: 50547,
                    dp: 0,
                    unit: "K",
                },
                block_groups: { field: "blockgroups_covered", sub: "block groups", fallback: 142719, dp: 0 },
                jurisdictions: {
                    field: "jurisdictions_covered",
                    sub: "jurisdictions",
                    fallback: 10509,
                    dp: 1,
                    unit: "K",
                },
                pages: { field: "pages_analyzed", sub: "zoning pages", fallback: 1261957, dp: 1 },
                housing_units: {
                    field: "housing_units_covered",
                    sub: "housing units",
                    fallback: 92236215,
                    dp: 0,
                },
                slices: { field: "slices_total", sub: "slices", fallback: 169240, dp: 0 },
                districts: { field: "districts_published", sub: "zoning districts", fallback: 114355, dp: 0 },
            };

            var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

            // ── Number formatting ──────────────────────────────────────
            // Round to `dp` decimals; dp 0 → whole number, else drop trailing ".0".
            function roundDp(x, dp) {
                if (dp === 0) return String(Math.round(x));
                return (Math.round(x * 10) / 10).toFixed(1).replace(/\.0$/, "");
            }
            // Format a number with K / M / B. `dp` = decimal places (default 1).
            // `unit` (optional) forces "K" | "M" | "B"; otherwise it's picked by
            // magnitude, and anything under 100,000 is shown with commas.
            function abbr(n, dp, unit) {
                if (dp == null) dp = 1;
                var a = Math.abs(n);
                if (unit === "B" || (!unit && a >= 1e9)) return roundDp(n / 1e9, dp) + "B";
                if (unit === "M" || (!unit && a >= 1e6)) return roundDp(n / 1e6, dp) + "M";
                if (unit === "K" || (!unit && a > 99999)) return roundDp(n / 1e3, dp) + "K";
                return Math.round(n).toLocaleString("en-US");
            }
            // Number + a smaller trailing "+" (e.g. 216.8M+). `show` is the
            // per-card plus flag (defaults on if omitted).
            function withPlus(n, show, dp, unit) {
                if (show === false) return abbr(n, dp, unit);
                return abbr(n, dp, unit) + '<span class="lul-covp__plus">+</span>';
            }

            // ── Build the cards from SELECTED ──────────────────────────
            // Each entry resolves to a def { field (null if hardcoded), sub, fallback, plus }.
            // `plus` defaults to SHOW_PLUS, but a hardcoded card can override it
            // per-card via a `plus: false` (or true) property.
            var defs = SELECTED.map(function (entry) {
                if (typeof entry === "string") {
                    var m = METRICS[entry];
                    if (!m) {
                        // unknown key → warn so the card isn't silently dropped
                        console.warn('[coverage_stats_product_compact] unknown metric key: "' + entry + '"');
                        return null;
                    }
                    return {
                        field: m.field,
                        sub: m.sub,
                        fallback: m.fallback,
                        // per-metric plus override (falls back to global SHOW_PLUS)
                        plus: m.plus !== undefined ? m.plus : SHOW_PLUS,
                        dp: m.dp,
                        unit: m.unit,
                    };
                }
                return {
                    field: null,
                    sub: entry.label,
                    fallback: entry.value,
                    plus: entry.plus !== undefined ? entry.plus : SHOW_PLUS,
                    dp: entry.dp,
                    unit: entry.unit,
                    accent: entry.accent === true,
                };
            }).filter(Boolean);

            var records = []; // { el, subEl, def, target }
            defs.forEach(function (def) {
                var card = document.createElement("article");
                card.className = "lul-covp__card" + (def.accent ? " lul-covp__card--accent" : "");
                var num = document.createElement("p");
                num.className = "lul-covp__num";
                num.textContent = "—";
                var sub = document.createElement("p");
                sub.className = "lul-covp__sub";
                card.appendChild(sub);
                card.appendChild(num);
                grid.appendChild(card);
                records.push({ el: num, subEl: sub, def: def, target: null });
            });

            // ── Fill each card from a data row (API row, or null → fallback) ──
            function num(row, field) {
                return field && row && typeof row[field] === "number" ? row[field] : null;
            }
            function populate(row) {
                records.forEach(function (rec) {
                    var def = rec.def;
                    var val = num(row, def.field);
                    if (val === null && typeof def.fallback === "number") val = def.fallback;
                    rec.subEl.textContent = def.sub;
                    rec.target = typeof val === "number" ? val : null;
                    if (rec.target === null) rec.el.textContent = "—";
                    else rec.el.innerHTML = withPlus(rec.target, def.plus, def.dp, def.unit);
                });
            }

            // ── Responsive columns, measured off the BLOCK (not the viewport) ──
            // Card width and column gap are read back from the CSS custom
            // properties above, so the TWEAKABLE SIZING block stays the single
            // source of truth — edit the CSS and the breakpoints follow.
            function cssPx(name, fallback) {
                var v = parseFloat(getComputedStyle(root).getPropertyValue(name));
                return isNaN(v) ? fallback : v;
            }
            function setColsP() {
                // clientWidth excludes any scrollbar; padding here is vertical only
                var w = root.clientWidth || root.getBoundingClientRect().width || 0;
                if (!w) return;
                var cardW = cssPx("--lulp-card-w", 150);
                var gapX = cssPx("--lulp-gap-x", 16);
                // first step (widest first) that fits; floor = last step, which
                // is used even if it doesn't fit — the tracks shrink instead
                var cols = COL_STEPS[COL_STEPS.length - 1];
                for (var i = 0; i < COL_STEPS.length; i++) {
                    var n = COL_STEPS[i];
                    if (w >= n * cardW + (n - 1) * gapX) {
                        cols = n;
                        break;
                    }
                }
                root.style.setProperty("--lulp-cols", cols);
                root.setAttribute("data-cols", cols); // handy for styling hooks

                // Step the type down one stop on a really narrow block, so a
                // long number doesn't bleed past the card edge. Read the
                // threshold back from CSS so it stays tweakable in one place.
                var smallAt = cssPx("--lulp-small-at", 300);
                root.setAttribute("data-size", w < smallAt ? "sm" : "md");
            }
            setColsP();
            if ("ResizeObserver" in window) {
                // fires on block resize AND on the initial layout pass, which
                // covers Squarespace mounting/animating the block after load
                new ResizeObserver(setColsP).observe(root);
            } else {
                window.addEventListener("resize", setColsP);
                window.addEventListener("load", setColsP);
            }

            // ── Animation ──────────────────────────────────────────────
            function countUp(rec) {
                if (rec.target === null) return;
                var duration = 1000;
                var start = null;
                function frame(now) {
                    if (start === null) start = now;
                    var p = Math.min((now - start) / duration, 1);
                    var eased = 1 - Math.pow(1 - p, 3); // easeOutCubic
                    // number only while counting; the "+" appears once it lands
                    if (p < 1) {
                        rec.el.textContent = abbr(rec.target * eased, rec.def.dp, rec.def.unit);
                        requestAnimationFrame(frame);
                    } else {
                        rec.el.innerHTML = withPlus(rec.target, rec.def.plus, rec.def.dp, rec.def.unit);
                    }
                }
                requestAnimationFrame(frame);
            }
            var started = false;
            function begin() {
                if (started) return;
                started = true;
                if (reduce || !("IntersectionObserver" in window)) {
                    records.forEach(function (rec) {
                        if (rec.target !== null)
                            rec.el.innerHTML = withPlus(rec.target, rec.def.plus, rec.def.dp, rec.def.unit);
                    });
                    return;
                }
                var byEl = new Map();
                records.forEach(function (rec) {
                    byEl.set(rec.el, rec);
                });
                var io = new IntersectionObserver(
                    function (entries) {
                        entries.forEach(function (entry) {
                            if (entry.isIntersecting) {
                                countUp(byEl.get(entry.target));
                                io.unobserve(entry.target);
                            }
                        });
                    },
                    { threshold: 0.4 },
                );
                records.forEach(function (rec) {
                    io.observe(rec.el);
                });
            }

            // ── Fetch live data, then animate (fall back on failure/timeout) ──
            var timer = setTimeout(function () {
                populate(null);
                begin();
            }, 2500);
            fetch(API, { headers: { Accept: "application/json" } })
                .then(function (r) {
                    if (!r.ok) throw new Error("HTTP " + r.status);
                    return r.json();
                })
                .then(function (data) {
                    var row = Array.isArray(data) ? data[0] : data;
                    populate(row || null);
                })
                .catch(function () {
                    populate(null); // keep hardcoded fallbacks where available
                })
                .then(function () {
                    clearTimeout(timer);
                    begin();
                });
        })();
    </script>
</section>
