<!--
  Primary button (filled purple) with a dropdown menu.

  ▶ Everything comes from styles/lul.css (section 4); this file is markup only.
    A button's border always
    matches its own fill/outline, and each menu inherits its parent button's
    colour via --lul-menu-accent so the seam under the button lines up.
-->
<!-- Local preview only. Squarespace already carries these rules in Custom CSS,
     so this line can be deleted when pasting the block in (harmless if left). -->
<link rel="stylesheet" href="../styles/lul.css">

<div class="lul lul-actions">
    <div class="lul-actions__dropdown">
        <a href="#" role="button" class="lul-cta lul-cta--primary lul-actions__toggle">
            View Data Dictionary
            <svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path
                    d="M5 8l5 5 5-5"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                />
            </svg>
        </a>
        <div class="lul-actions__menu">
            <a
                class="lul-actions__option"
                href="https://docs.google.com/spreadsheets/d/17nrhEbS1OuwdRotXZwyiKmVuKccYH1A3/edit?gid=112307427#gid=112307427"
                >General</a
            >
            <a
                class="lul-actions__option"
                href="https://docs.google.com/spreadsheets/d/17nrhEbS1OuwdRotXZwyiKmVuKccYH1A3/edit?gid=1343210928#gid=1343210928"
                >Residential</a
            >
            <a
                class="lul-actions__option"
                href="https://docs.google.com/spreadsheets/d/17nrhEbS1OuwdRotXZwyiKmVuKccYH1A3/edit?gid=421718271#gid=421718271"
                >Nonresidential</a
            >
        </div>
    </div>
</div>

<script>
    (function () {
        var dropdowns = document.querySelectorAll(".lul-actions .lul-actions__dropdown");

        dropdowns.forEach(function (dd) {
            var toggle = dd.querySelector(".lul-actions__toggle");
            toggle.addEventListener("click", function (e) {
                e.preventDefault();
                e.stopPropagation();
                var isOpen = dd.classList.contains("lul-is-open");
                dropdowns.forEach(function (other) {
                    other.classList.remove("lul-is-open");
                });
                if (!isOpen) dd.classList.add("lul-is-open");
            });
        });

        document.addEventListener("click", function () {
            dropdowns.forEach(function (dd) {
                dd.classList.remove("lul-is-open");
            });
        });
    })();
</script>
