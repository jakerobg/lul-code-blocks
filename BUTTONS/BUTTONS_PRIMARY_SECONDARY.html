<!--
  Data action buttons — primary (filled purple) + secondary (outlined).

  ▶ Everything comes from styles/lul.css (section 4). This file is markup only.
    .lul-cta is the button; .lul-cta--primary / --secondary pick the fill. The
    primary's border always matches its own fill, so it reads as a solid block;
    the secondary keeps the dark ink outline. .lul-actions is just the row.
-->
<!-- Local preview only. Squarespace already carries these rules in Custom CSS,
     so this line can be deleted when pasting the block in (harmless if left). -->
<link rel="stylesheet" href="../styles/lul.css" />

<div class="lul lul-actions">
    <a class="lul-cta lul-cta--primary" href="#order">Order Rasters</a>
    <a class="lul-cta lul-cta--secondary" href="#sample">Explore Demo</a>
</div>
