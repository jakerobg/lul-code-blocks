<!--
  Single secondary button (outlined ink), left-aligned.

  ▶ Everything comes from styles/lul.css (section 4). This file is markup only.
    One class does it: .lul-cta is the button, .lul-cta--secondary the outline.
  ▶ This used to carry its own .lul-sbtn- class names to stop two button
    blocks on one page clobbering each other's rules. That risk came from each
    block shipping its own <style> copy; with one shared stylesheet there is
    nothing left to clobber, so it uses the common .lul-actions classes now.
-->
<!-- Local preview only. Squarespace already carries these rules in Custom CSS,
     so this line can be deleted when pasting the block in (harmless if left). -->
<link rel="stylesheet" href="../styles/lul.css">

<a class="lul-cta lul-cta--secondary" href="#">Contact us</a>
