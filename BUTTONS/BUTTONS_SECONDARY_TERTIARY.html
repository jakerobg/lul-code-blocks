<!--
  Data action buttons — secondary (outlined) + tertiary (filled ink).

  Byte-for-byte the same shell as BUTTONS_PRIMARY_SECONDARY.html — only the
  colours, labels and links differ. The filled slot is DARK INK rather than the
  purple accent; that ink-filled variant is what we call a tertiary button (see
  industry_pages/product_tabs.html, which uses it for its selected tab).

  ▶ Colours and padding are the vars at the top. A button's border always
    matches its own fill/outline, so the tertiary reads as a solid block and
    the secondary keeps the dark ink outline.
-->
<style>
    .lul-actions {
        --lul-ink: #393347; /* secondary border + label, tertiary fill */
        --lul-ink-hover: #4c4460; /* tertiary hover fill */
        --lul-secondary-hover: #ffffff;
        --lul-btn-pad: 10px 26px;

        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        color: var(--lul-ink);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        display: flex;
        align-items: center;
        justify-content: flex-start;
        gap: 18px;
        flex-wrap: wrap;
    }
    .lul-actions *,
    .lul-actions *::before,
    .lul-actions *::after {
        box-sizing: border-box;
    }

    /* Shared shell. Border is transparent here so each variant owns its own
       border-colour rather than overriding a default. */
    .lul-actions .lul-actions__btn {
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-weight: 500;
        font-size: 1rem;
        padding: var(--lul-btn-pad);
        border: 1px solid transparent;
        border-radius: 0;
        text-decoration: none;
        letter-spacing: 0.02em;
        cursor: pointer;
        transition:
            background 0.25s ease,
            border-color 0.25s ease,
            color 0.25s ease;
    }

    .lul-actions .lul-actions__btn--tertiary {
        background: var(--lul-ink);
        border-color: var(--lul-ink);
        color: #ffffff;
    }
    .lul-actions .lul-actions__btn--tertiary:hover {
        background: var(--lul-ink-hover);
        border-color: var(--lul-ink-hover);
    }

    .lul-actions .lul-actions__btn--secondary {
        background: transparent;
        border-color: var(--lul-ink);
        color: var(--lul-ink);
    }
    .lul-actions .lul-actions__btn--secondary:hover {
        background: var(--lul-secondary-hover);
    }
</style>

<div class="lul-actions">
    <a class="lul-actions__btn lul-actions__btn--secondary" href="https://www.landuselabs.com/s/Parcel-Report-Sample.pdf"
        >Download Sample</a>
    <a class="lul-actions__btn lul-actions__btn--tertiary" href="https://docs.google.com/spreadsheets/d/17nrhEbS1OuwdRotXZwyiKmVuKccYH1A3/edit?gid=1390244737#gid=1390244737"
        >Data Dictionary</a>
</div>
