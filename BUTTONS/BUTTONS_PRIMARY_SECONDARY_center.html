<!--
  Data action buttons, CENTERED — primary (filled purple) + secondary (outlined).

  ▶ Colours and padding are the vars at the top. The primary button's border
    always matches its own fill, so it reads as a solid block; the secondary
    keeps the dark ink outline.

  Centering lives on the --center modifier, not the base class, so this block
  and the left-aligned one can coexist on the same page without fighting.
-->
<style>
    .lul-actions {
        --lul-ink: #393347; /* secondary border + label */
        --lul-primary: #594496; /* primary fill + border */
        --lul-primary-hover: #3f2e70;
        --lul-secondary-hover: #f9f9f9;
        --lul-btn-pad: 10px 26px;

        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        color: var(--lul-ink);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        display: flex;
        align-items: center;
        justify-content: flex-start;
        gap: 18px;
        flex-wrap: wrap;
    }
    .lul-actions--center {
        justify-content: center;
    }
    .lul-actions *,
    .lul-actions *::before,
    .lul-actions *::after {
        box-sizing: border-box;
    }

    /* Shared shell. Border is transparent here so each variant owns its own
       border-colour rather than overriding a default. */
    .lul-actions .lul-actions__btn {
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        font-weight: 500;
        font-size: 1rem;
        padding: var(--lul-btn-pad);
        border: 1px solid transparent;
        border-radius: 0;
        text-decoration: none;
        letter-spacing: 0.02em;
        cursor: pointer;
        transition:
            background 0.25s ease,
            border-color 0.25s ease,
            color 0.25s ease,
            gap 0.25s ease;
    }
    .lul-actions .lul-actions__btn:hover {
        gap: 12px;
    }

    .lul-actions .lul-actions__btn--primary {
        background: var(--lul-primary);
        border-color: var(--lul-primary);
        color: #ffffff;
    }
    .lul-actions .lul-actions__btn--primary:hover {
        background: var(--lul-primary-hover);
        border-color: var(--lul-primary-hover);
    }

    .lul-actions .lul-actions__btn--secondary {
        background: transparent;
        border-color: var(--lul-ink);
        color: var(--lul-ink);
    }
    .lul-actions .lul-actions__btn--secondary:hover {
        background: var(--lul-secondary-hover);
    }

    .lul-actions .lul-actions__btn svg {
        width: 14px;
        height: 14px;
        transition: transform 0.25s ease;
    }
    .lul-actions .lul-actions__btn:hover svg {
        transform: translateX(2px);
    }
</style>

<div class="lul-actions lul-actions--center">
    <a class="lul-actions__btn lul-actions__btn--primary" href="/product-selector"
        >Find Your Product
        <svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path
                d="M4 10h12m0 0l-5-5m5 5l-5 5"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
            />
        </svg>
    </a>
    <a class="lul-actions__btn lul-actions__btn--secondary" href="/services"
        >Explore Services
        <svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path
                d="M4 10h12m0 0l-5-5m5 5l-5 5"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
            />
        </svg>
    </a>
</div>
