<!--
  Data action buttons, CENTERED — primary (filled purple, plain link) +
  secondary (outlined) with a dropdown menu.

  Only the SECONDARY is a dropdown here; the primary is an ordinary link.
  Compare buttons_PRIMARY_SECONDARY_dropdown.html, where both are dropdowns.

  ▶ Colours and padding are the vars at the top. A button's border always
    matches its own fill/outline, and the menu inherits the secondary's ink
    via --lul-menu-accent so the seam under the button lines up.
  ▶ Centering lives on the --center modifier, not the base class, so this block
    and the left-aligned ones can coexist on the same page without fighting.
  ▶ The menu is centred under its button rather than left-aligned to it, since
    the pair itself is centred.
  ▶ SET THE PRIMARY: its label and href are marked below — it defaults to the
    Data Dictionary link used by the other centred button block.
-->
<style>
    .lul-actions {
        --lul-ink: #393347; /* secondary border + label */
        --lul-primary: #594496; /* primary fill + border */
        --lul-primary-hover: #3f2e70;
        --lul-secondary-hover: #ffffff;
        --lul-btn-pad: 10px 26px;

        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        color: var(--lul-ink);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        display: flex;
        align-items: center;
        justify-content: flex-start;
        gap: 18px;
        flex-wrap: wrap;
    }
    .lul-actions--center {
        justify-content: center;
    }
    .lul-actions *,
    .lul-actions *::before,
    .lul-actions *::after {
        box-sizing: border-box;
    }

    /* The dropdown passes its button's colour down to its own menu. */
    .lul-actions .lul-actions__dropdown {
        position: relative;
        display: inline-block;
        --lul-menu-accent: var(--lul-ink);
    }
    .lul-actions .lul-actions__dropdown:has(.lul-actions__btn--primary) {
        --lul-menu-accent: var(--lul-primary);
    }

    /* Shared shell. Border is transparent here so each variant owns its own
       border-colour rather than overriding a default. */
    .lul-actions .lul-actions__btn {
        -webkit-appearance: none;
        appearance: none;
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        font-weight: 500;
        font-size: 1rem;
        line-height: 1.2;
        padding: var(--lul-btn-pad);
        border: 1px solid transparent;
        border-radius: 0;
        text-decoration: none;
        letter-spacing: 0.02em;
        cursor: pointer;
        transition:
            background 0.25s ease,
            border-color 0.25s ease,
            color 0.25s ease,
            gap 0.25s ease;
    }
    /* only the dropdown button has a caret to nudge */
    .lul-actions .lul-actions__toggle:hover {
        gap: 12px;
    }

    .lul-actions .lul-actions__btn--primary {
        background: var(--lul-primary);
        border-color: var(--lul-primary);
        color: #ffffff;
    }
    .lul-actions .lul-actions__btn--primary:hover {
        background: var(--lul-primary-hover);
        border-color: var(--lul-primary-hover);
    }

    .lul-actions .lul-actions__btn--secondary {
        background: transparent;
        border-color: var(--lul-ink);
        color: var(--lul-ink);
    }
    .lul-actions .lul-actions__btn--secondary:hover {
        background: var(--lul-secondary-hover);
    }

    .lul-actions .lul-actions__btn svg {
        width: 14px;
        height: 14px;
        transition: transform 0.25s ease;
    }
    .lul-actions .lul-actions__dropdown.lul-is-open .lul-actions__btn svg {
        transform: rotate(180deg);
    }

    /* Dropdown menu — centred on the button, since the pair is centred. */
    .lul-actions .lul-actions__menu {
        position: absolute;
        top: calc(100% - 1px); /* overlap the button's bottom border */
        left: 50%;
        transform: translateX(-50%);
        min-width: 100%;
        background: #ffffff;
        border: 1px solid var(--lul-menu-accent);
        z-index: 50;
        display: none;
        flex-direction: column;
    }
    .lul-actions .lul-actions__dropdown.lul-is-open .lul-actions__menu {
        display: flex;
    }
    .lul-actions .lul-actions__option {
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 0.95rem;
        color: var(--lul-ink);
        text-decoration: none;
        white-space: nowrap;
        padding: var(--lul-btn-pad);
        border-bottom: 1px solid rgba(57, 51, 71, 0.15);
        transition:
            background 0.2s ease,
            color 0.2s ease;
    }
    .lul-actions .lul-actions__option:last-child {
        border-bottom: none;
    }
    .lul-actions .lul-actions__option:hover {
        background: var(--lul-menu-accent);
        color: #ffffff;
    }
</style>

<div class="lul-actions lul-actions--center">
    <!-- PRIMARY — plain link, no menu. Change the label and href here. -->
    <a class="lul-actions__btn lul-actions__btn--primary" href="#order">Get Instant Pricing</a>

    <!-- SECONDARY — dropdown of sample downloads -->
    <div class="lul-actions__dropdown">
        <a href="#" role="button" class="lul-actions__btn lul-actions__btn--secondary lul-actions__toggle">
            Download Sample
            <svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path
                    d="M5 8l5 5 5-5"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                />
            </svg>
        </a>
        <div class="lul-actions__menu">
            <a class="lul-actions__option" href="https://www.landuselabs.com/s/jurisdiction_table_sample.csv"
                >Jurisdictions</a
            >
            <a
                class="lul-actions__option"
                href="https://www.landuselabs.com/s/belknap_county_nh_censustract_table_sample.csv"
                >Census Tracts</a
            >
            <a
                class="lul-actions__option"
                href="https://www.landuselabs.com/s/belknap_county_nh_blockgroup_table_sample.csv"
                >Block Groups</a
            >
        </div>
    </div>
</div>

<script>
    (function () {
        var dropdowns = document.querySelectorAll(".lul-actions .lul-actions__dropdown");

        dropdowns.forEach(function (dd) {
            var toggle = dd.querySelector(".lul-actions__toggle");
            toggle.addEventListener("click", function (e) {
                e.preventDefault();
                e.stopPropagation();
                var isOpen = dd.classList.contains("lul-is-open");
                dropdowns.forEach(function (other) {
                    other.classList.remove("lul-is-open");
                });
                if (!isOpen) dd.classList.add("lul-is-open");
            });
        });

        document.addEventListener("click", function () {
            dropdowns.forEach(function (dd) {
                dd.classList.remove("lul-is-open");
            });
        });
    })();
</script>
