<!--
  Single primary button (filled purple), centered in its container.

  ▶ Colour, padding and type all come from styles/lul.css (section 5). This
    file is markup only.
  ▶ This used to carry its own .lul-actions-center block, because each file
    shipped its own <style> and whichever Squarespace emitted last would win.
    With one shared stylesheet that cannot happen, so centring is now just the
    .lul-actions--center modifier. max-width/text-align moved onto the shared
    button shell, so a long label still stays centred.
-->
<!-- Local preview only. Squarespace already carries these rules in Custom CSS,
     so this line can be deleted when pasting the block in (harmless if left). -->
<link rel="stylesheet" href="../styles/lul.css">

<div class="lul lul-actions lul-actions--center">
    <a class="lul-cta lul-cta--primary" href="/services"
        >Explore services</a>
</div>
