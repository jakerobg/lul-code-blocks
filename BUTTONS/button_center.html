<!--
  Single primary button (filled purple), centered in its container.

  ▶ Colours and padding are the vars at the top. The border always matches the
    fill, so the button reads as a solid block.

  ▶ NAMESPACE: this file uses its OWN block, .lul-actions-center, rather than
    the shared .lul-actions. Its rules genuinely differ from the multi-button
    files — the row centres, and the button carries max-width/text-align so a
    long label stays centered — so sharing a class name would mean whichever
    stylesheet Squarespace happened to output last silently won. With a
    distinct block, this can sit on the same page as any other button block.
    (Class selectors match exactly, so .lul-actions-center never collides with
    .lul-actions.)
-->
<style>
    .lul-actions-center {
        --lul-primary: #594496; /* primary fill + border */
        --lul-primary-hover: #3f2e70;
        --lul-btn-pad: 10px 26px;

        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 18px;
        flex-wrap: wrap;
    }
    .lul-actions-center *,
    .lul-actions-center *::before,
    .lul-actions-center *::after {
        box-sizing: border-box;
    }

    /* Button shell. Border is transparent here so each variant owns its own
       border-colour rather than overriding a default. */
    .lul-actions-center .lul-actions-center__btn {
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-weight: 500;
        font-size: 1rem;
        padding: var(--lul-btn-pad);
        border: 1px solid transparent;
        border-radius: 0;
        text-decoration: none;
        letter-spacing: 0.02em;
        cursor: pointer;
        max-width: 100%; /* never wider than the container → stays centered */
        text-align: center;
        transition:
            background 0.25s ease,
            border-color 0.25s ease,
            color 0.25s ease;
    }

    .lul-actions-center .lul-actions-center__btn--primary {
        background: var(--lul-primary);
        border-color: var(--lul-primary);
        color: #ffffff;
    }
    .lul-actions-center .lul-actions-center__btn--primary:hover {
        background: var(--lul-primary-hover);
        border-color: var(--lul-primary-hover);
    }
</style>

<div class="lul-actions-center">
    <a class="lul-actions-center__btn lul-actions-center__btn--primary" href="/services"
        >Explore Services</a>
</div>
