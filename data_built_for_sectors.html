<!--
  Zoning data for [sector] — one-line hero with a looping vertical PEEK reel
  of the six sectors (Squarespace Code Block). Five rows are visible: the
  current sector full-strength in the middle, two dimmed above and two below,
  with the outer rows fading out under a mask at the top/bottom edges. Every
  sector is left-aligned so they all start at the same x. Each links to
  /[slug]. JS-driven so we can tag the centered row; classes prefixed lul-scz-.

  Hovering a sector turns it sage-green and underlines it.

  ▶ Tuning: --scz-h = row height/step. --scz-dim = neighbor opacity
    (higher = darker/blacker). --scz-ul-y = how low the hover underline sits.
    The mask gradient on .lul-scz__carousel controls the edge fade.
    HOLD_MS / SLIDE_MS in the script = timing.
-->
<section class="lul-scz" aria-label="Zoning data for your sector">
    <style>
        .lul-scz {
            --lul-header: #393348;
            --lul-accent: #97a24f; /* sage-green used on hover */
            --scz-h: 1.5em; /* one sector row height / scroll step */
            --scz-dim: 0.7; /* previous/next sector opacity (raise = darker) */
            --scz-ul-y: 0.16em; /* how far below the text the hover underline sits */
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            color: var(--lul-header);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            width: 100%;
            box-sizing: border-box;
            padding: 6px 4px 6px;
            text-align: center;
        }
        .lul-scz *,
        .lul-scz *::before,
        .lul-scz *::after {
            box-sizing: border-box;
        }

        /* flex keeps the label + reel on one line and vertically centers the
           reel, so the CURRENT (center) sector lines up with the label. */
        .lul-scz__headline {
            display: flex;
            justify-content: left;
            align-items: center;
            gap: 0.6em;
            white-space: nowrap;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            font-weight: 500;
            font-size: clamp(1.4rem, 4.2vw, 2rem);
            line-height: 1.1;
            letter-spacing: -0.02em;
            margin: 0;
            color: var(--lul-header);
        }

        /* 5-row window: two above / current / two below. The mask fades the
           outer rows out at the top and bottom edges. */
        .lul-scz__carousel {
            display: block;
            overflow: hidden;
            height: calc(var(--scz-h) * 5);
            -webkit-mask-image: linear-gradient(
                to bottom,
                transparent 0%,
                rgba(0, 0, 0, 0.22) 18%,
                rgba(0, 0, 0, 1) 30%,
                rgba(0, 0, 0, 1) 70%,
                rgba(0, 0, 0, 0.22) 82%,
                transparent 100%
            );
            mask-image: linear-gradient(
                to bottom,
                transparent 0%,
                rgba(0, 0, 0, 0.22) 18%,
                rgba(0, 0, 0, 1) 30%,
                rgba(0, 0, 0, 1) 70%,
                rgba(0, 0, 0, 0.22) 82%,
                transparent 100%
            );
        }
        .lul-scz__strip {
            display: block;
            will-change: transform;
        }
        .lul-scz__item {
            display: block;
            height: var(--scz-h);
            line-height: var(--scz-h);
            white-space: nowrap; /* each sector always on one line */
            text-align: left; /* every sector starts at the same x */
            opacity: var(--scz-dim); /* neighbors dimmed... */
            transition: opacity 0.4s ease;
        }
        .lul-scz__item.is-current {
            opacity: 1; /* ...current sector full-strength */
        }
        /* Held on for the instant of the seamless-loop snap, so the newly
           centered sector does not fade up from dim and read as a flicker. */
        .lul-scz--nofade .lul-scz__item {
            transition: none;
        }
        .lul-scz__word {
            color: inherit;
            text-decoration: none;
            font-style: italic;
        }
        /* Hover turns it sage-green and adds a plain link underline — no
           animation, sat slightly low. */
        .lul-scz__word:hover {
            color: var(--lul-accent);
            text-decoration: underline;
            text-underline-offset: var(--scz-ul-y);
        }

        .lul-scz__subhead {
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            font-weight: 500;
            font-size: clamp(1rem, 1.4vw, 1.1rem);
            line-height: 1.5;
            color: rgba(57, 51, 72, 0.75);
            margin: clamp(16px, 2vw, 24px) auto 0;
            max-width: 640px;
            letter-spacing: -0.005em;
        }

        @media (max-width: 800px) {
            .lul-scz {
                padding: 6px 4px 6px;
            }
            /* smaller floor so the widest sentence still fits one line on phones */
            .lul-scz__headline {
                font-size: clamp(1.2rem, 4.6vw, 1.8rem);
            }
        }
    </style>

    <h1 class="lul-scz__headline">
        <!-- <span class="lul-scz__label">Powering</span> -->
        <span class="lul-scz__carousel">
            <span class="lul-scz__strip">
                <!-- clones of the LAST TWO sectors, filling the two faded rows
                     above the first sector -->
                <span class="lul-scz__item"
                    ><a class="lul-scz__word" href="/real-estate">Real Estate Professionals</a></span
                >
                <span class="lul-scz__item"><a class="lul-scz__word" href="/researchers">Researchers</a></span>

                <!-- the six real sectors -->
                <span class="lul-scz__item"
                    ><a class="lul-scz__word" href="/financial-services">Financial Services Professionals</a></span
                >
                <span class="lul-scz__item"><a class="lul-scz__word" href="/developers">Developers</a></span>
                <span class="lul-scz__item"><a class="lul-scz__word" href="/policymakers">Policymakers</a></span>
                <span class="lul-scz__item"><a class="lul-scz__word" href="/owners">Property Owners</a></span>
                <span class="lul-scz__item"
                    ><a class="lul-scz__word" href="/real-estate">Real Estate Professionals</a></span
                >
                <span class="lul-scz__item"><a class="lul-scz__word" href="/researchers">Researchers</a></span>

                <!-- clones of the first three, for a seamless reset + the two
                     faded rows below the last sector -->
                <span class="lul-scz__item"
                    ><a class="lul-scz__word" href="/financial-services">Financial Services Professionals</a></span
                >
                <span class="lul-scz__item"><a class="lul-scz__word" href="/developers">Developers</a></span>
                <span class="lul-scz__item"><a class="lul-scz__word" href="/policymakers">Policymakers</a></span>
            </span>
        </span>
    </h1>

    <script>
        (function () {
            var root = document.currentScript.closest(".lul-scz");
            if (!root) return;
            var strip = root.querySelector(".lul-scz__strip");
            if (!strip) return;
            var items = strip.children; // [s4,s5, s0..s5, s0,s1,s2] = 11
            var N = 6; // real sectors

            var HOLD_MS = 1700; // time each sector stays centered
            var SLIDE_MS = 550; // slide duration

            // Center the sector at real index p: strip index p+2 sits in the
            // middle of the five rows → translateY = -p * row height (in em,
            // so it scales with the font).
            function apply(p, animate) {
                // On an instant jump, freeze the opacity transition too — otherwise
                // the row landing in the center fades up from dim and flickers.
                if (!animate) root.classList.add("lul-scz--nofade");

                strip.style.transition = animate ? "transform " + SLIDE_MS + "ms cubic-bezier(0.7,0,0.3,1)" : "none";
                strip.style.transform = "translateY(calc(var(--scz-h) * " + -p + "))";
                for (var i = 0; i < items.length; i++) {
                    items[i].classList.toggle("is-current", i === p + 2);
                }

                if (!animate) {
                    void strip.offsetHeight; // flush the new opacities untransitioned
                    root.classList.remove("lul-scz--nofade");
                }
            }

            var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
            if (reduce) {
                apply(0, false);
                return;
            }

            var p = 0;
            apply(0, false);
            function next() {
                p++;
                apply(p, true);
                if (p >= N) {
                    // slid onto the first sector's clone (identical view) — after
                    // the slide, snap back to the real first with no transition.
                    setTimeout(function () {
                        p = 0;
                        apply(0, false);
                        setTimeout(next, HOLD_MS);
                    }, SLIDE_MS);
                } else {
                    setTimeout(next, SLIDE_MS + HOLD_MS);
                }
            }
            setTimeout(next, HOLD_MS);
        })();
    </script>
</section>
